// ── BLOC DE NOTAS ─────────────────────────────────────────────────────────────
const HIGHLIGHT_COLORS=[
  {id:'yellow',label:'Amarillo',color:'#FEF08A'},
  {id:'green',label:'Verde',color:'#BBF7D0'},
  {id:'blue',label:'Azul',color:'#BFDBFE'},
  {id:'pink',label:'Rosa',color:'#FBCFE8'},
  {id:'violet',label:'Violeta',color:'#DDD6FE'},
];
function stripHtml(html){
  if(typeof document==='undefined')return String(html||'').replace(/<[^>]*>/g,' ');
  const d=document.createElement('div');
  d.innerHTML=html||'';
  return d.textContent||'';
}
function cleanNotebookHtml(html){
  if(typeof document==='undefined')return String(html||'');
  const d=document.createElement('div');
  d.innerHTML=html||'';
  d.querySelectorAll('[style]').forEach(el=>{
    el.style.removeProperty('color');
    el.style.removeProperty('-webkit-text-fill-color');
    if(!el.getAttribute('style'))el.removeAttribute('style');
  });
  return d.innerHTML;
}
function makeNotebookPage(n){
  const now=new Date().toISOString();
  return{id:'p'+Date.now()+Math.floor(Math.random()*1000),title:`Página ${n}`,html:'',text:'',createdAt:now,updatedAt:now};
}
function BlocNotasScreen({notebook,setNotebook,agendaNotes}){
  const isD=useD();
  const px=isD?52:14;
  const editorRef=useRef(null);
  const data=normalizeNotebook(notebook);
  const pages=data.pages;
  const current=pages.find(p=>p.id===data.currentId)||pages[0]||null;
  const currentIndex=Math.max(0,pages.findIndex(p=>p.id===current?.id));

  useEffect(()=>{
    if(pages.length>0)return;
    const legacy=Object.entries(agendaNotes||{}).filter(([,n])=>n&&!n.deleted&&String(n.text||'').trim());
    if(legacy.length){
      setNotebook({
        pages:legacy.sort((a,b)=>String(a[0]).localeCompare(String(b[0]))).map(([key,n],i)=>({
          id:'p'+key.replaceAll('-','')+i,
          title:`Página ${i+1}`,
          html:String(n.text||'').split('\n').map(line=>line||'<br>').join('<br>'),
          text:String(n.text||''),
          createdAt:n.updatedAt||new Date().toISOString(),
          updatedAt:n.updatedAt||new Date().toISOString(),
        })),
        currentId:null,
      });
    }else{
      const first=makeNotebookPage(1);
      setNotebook({pages:[first],currentId:first.id});
    }
  },[]);

  useEffect(()=>{
    if(editorRef.current&&current){
      const html=cleanNotebookHtml(current.html||'');
      if(editorRef.current.innerHTML!==html)editorRef.current.innerHTML=html;
    }
  },[current?.id]);

  function patchNotebook(updater){
    setNotebook(prev=>{
      const n=normalizeNotebook(prev);
      const next=typeof updater==='function'?updater(n):updater;
      return normalizeNotebook(next);
    });
  }
  function selectPage(id){patchNotebook(n=>({...n,currentId:id}));}
	  function addPage(){
	    patchNotebook(n=>{
	      const page=makeNotebookPage((n.pages||[]).length+1);
	      return{pages:[...(n.pages||[]),page],currentId:page.id};
	    });
	  }
	  function deletePage(id=current?.id){
	    if(!id)return;
	    const page=pages.find(p=>p.id===id);
	    const label=page?.title||'esta página';
	    if(!window.confirm(`¿Borrar "${label}"? Esta acción no se puede deshacer.`))return;
	    patchNotebook(n=>{
	      const list=n.pages||[];
	      const idx=Math.max(0,list.findIndex(p=>p.id===id));
	      const nextPages=list.filter(p=>p.id!==id);
	      if(nextPages.length===0){
	        const first=makeNotebookPage(1);
	        return{pages:[first],currentId:first.id};
	      }
	      const nextCurrent=nextPages[Math.min(idx,nextPages.length-1)]?.id||nextPages[0]?.id||null;
	      return{pages:nextPages,currentId:nextCurrent};
	    });
	  }
	  function renamePage(title){
	    if(!current)return;
	    const clean=title.trim()||`Página ${currentIndex+1}`;
	    patchNotebook(n=>({...n,pages:n.pages.map(p=>p.id===current.id?{...p,title:clean,updatedAt:new Date().toISOString()}:p)}));
  }
  function saveEditor(){
    if(!current||!editorRef.current)return;
    const html=cleanNotebookHtml(editorRef.current.innerHTML);
    const text=stripHtml(html);
    patchNotebook(n=>({...n,pages:n.pages.map(p=>p.id===current.id?{...p,html,text,updatedAt:new Date().toISOString()}:p)}));
  }
  function highlight(color){
    if(!editorRef.current)return;
    editorRef.current.focus();
    try{document.execCommand('styleWithCSS',false,true);document.execCommand('hiliteColor',false,color);}catch{}
    saveEditor();
  }
  function clearHighlight(){
    if(!editorRef.current)return;
    editorRef.current.focus();
    try{document.execCommand('removeFormat',false,null);}catch{}
    saveEditor();
  }

  return<div style={{display:'flex',flexDirection:'column',flex:1,minHeight:0,height:'100%'}}>
    <NavHeader eyebrow="BLOC" title="Bloc de notas" subtitle={`${pages.length} página${pages.length!==1?'s':''}`}/>
    <div className="scroll zp-page" style={{flex:1,minHeight:0,paddingBottom:14}}>
      <div style={{padding:`0 ${px}px`,display:'grid',gridTemplateColumns:isD?'260px minmax(0,1fr)':'1fr',gap:isD?16:12,alignItems:'start'}}>
        <Card radius={22} padding={0}>
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'14px 16px 10px'}}>
            <div style={{fontSize:15,fontWeight:700,color:'var(--text-1)',letterSpacing:-0.2}}>Páginas</div>
            <button onClick={addPage} style={{width:28,height:28,borderRadius:14,background:'var(--accent-soft)',color:'var(--accent)',
              display:'flex',alignItems:'center',justifyContent:'center'}}><IPlus size={14}/></button>
          </div>
          {pages.map((page,i)=>{
            const active=page.id===current?.id;
            return<button key={page.id} onClick={()=>selectPage(page.id)}
              style={{width:'100%',textAlign:'left',padding:'12px 16px',borderTop:i>0?'0.5px solid var(--separator)':'none',
                background:active?'var(--accent-soft)':'transparent',display:'block'}}>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',gap:8,marginBottom:4}}>
                <span style={{fontSize:13,fontWeight:700,color:active?'var(--accent)':'var(--text-1)'}}>{page.title}</span>
                <span style={{fontSize:11,color:'var(--text-3)'}}>{i+1}</span>
              </div>
              <div style={{fontSize:12.5,color:'var(--text-3)',lineHeight:1.35,display:'-webkit-box',
                WebkitLineClamp:2,WebkitBoxOrient:'vertical',overflow:'hidden'}}>{page.text||'Página en blanco'}</div>
            </button>;
          })}
        </Card>

        <Card radius={22} padding={isD?18:14}>
          {current&&<>
	            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',gap:12,marginBottom:12,flexWrap:'wrap'}}>
	              <input value={current.title} onChange={e=>renamePage(e.target.value)}
	                style={{flex:1,minWidth:160,fontSize:isD?20:17,fontWeight:700,color:'var(--text-1)',letterSpacing:-0.3,
	                  background:'transparent',border:'none',outline:'none',fontFamily:'inherit'}}/>
	              <Chip tint="var(--accent)">Página {currentIndex+1}</Chip>
	              <button onClick={()=>deletePage()} title="Borrar página" aria-label="Borrar página"
	                style={{width:32,height:32,borderRadius:16,background:'var(--fill-1)',color:'var(--text-3)',
	                  display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
	                <IClose size={13}/>
	              </button>
	            </div>
            <div style={{display:'flex',alignItems:'center',gap:8,flexWrap:'wrap',marginBottom:12}}>
              <span style={{fontSize:12,color:'var(--text-3)',fontWeight:600}}>Subrayar</span>
              {HIGHLIGHT_COLORS.map(c=><button key={c.id} title={c.label} onClick={()=>highlight(c.color)}
                style={{width:28,height:28,borderRadius:14,background:c.color,border:'1px solid rgba(0,0,0,0.08)'}}/>)}
              <button onClick={clearHighlight} style={{padding:'6px 10px',borderRadius:999,background:'var(--fill-1)',
                color:'var(--text-2)',fontSize:12,fontWeight:600}}>Quitar</button>
            </div>
            <div ref={editorRef} className="zp-notebook-editor" contentEditable suppressContentEditableWarning onInput={saveEditor}
              data-placeholder="Escribe aquí como en un libro..."
              style={{width:'100%',minHeight:isD?'calc(100vh - 315px)':390,fontFamily:'ui-rounded,-apple-system,system-ui',
                fontSize:isD?17:16,lineHeight:1.75,color:'var(--text-1)',background:'repeating-linear-gradient(to bottom,var(--surface-1) 0,var(--surface-1) 31px,var(--separator) 32px)',
                border:'0.5px solid var(--hairline)',borderRadius:16,padding:'18px 18px',outline:'none',boxSizing:'border-box',
                whiteSpace:'pre-wrap',overflowWrap:'break-word'}}/>
          </>}
        </Card>
      </div>
    </div>
  </div>;
}

// ── 12 SEMANAS ────────────────────────────────────────────────────────────────
function DoceScreen(){
  const isD=useD();
  const[twelve,setTwelve]=useLS('zp_twelve',null);
  const[focus,setFocus]=useState('');
  const[startDate,setStartDate]=useState(TODAY_KEY);
  const[newTactic,setNewTactic]=useState('');
  const[editTactic,setEditTactic]=useState({i:-1,v:''});
  const[editWeek,setEditWeek]=useState({w:-1,v:''});
  const px=isD?52:14;
  const cycle=twelve&&twelve.startDate?twelve:null;
  const weeks=[];
  let currentWeek=null;
  if(cycle){
    const start=new Date(cycle.startDate);
    const diffDays=Math.floor((TODAY-start)/86400000);
    currentWeek=Math.max(1,Math.min(12,Math.floor(diffDays/7)+1));
    for(let w=1;w<=12;w++){
      const score=cycle.scores&&cycle.scores[w]!=null?cycle.scores[w]:null;
      weeks.push({w,score,current:w===currentWeek});
    }
  }
  const tactics=cycle&&Array.isArray(cycle.tactics)?cycle.tactics:[];
  const scores=weeks.filter(w=>w.score!==null).map(w=>w.score);
  const avg=scores.length>0?Math.round(scores.reduce((a,b)=>a+b,0)/scores.length):null;
  function startCycle(){
    if(!focus.trim()||!startDate)return;
    setTwelve({focus:focus.trim(),startDate,tactics:[],scores:{}});
    setFocus('');
  }
  function endCycle(){
    if(typeof window!=='undefined'&&!window.confirm('¿Terminar el ciclo? Se borrarán los datos.'))return;
    setTwelve(null);
  }
  function addTactic(){
    if(!newTactic.trim())return;
    setTwelve(prev=>({...prev,tactics:[...(prev.tactics||[]),{t:newTactic.trim(),pct:0}]}));
    setNewTactic('');
  }
  function removeTactic(i){
    setTwelve(prev=>({...prev,tactics:(prev.tactics||[]).filter((_,j)=>j!==i)}));
  }
  function commitTactic(){
    const i=editTactic.i;if(i<0)return;
    const n=Math.max(0,Math.min(100,parseInt(editTactic.v,10)||0));
    setTwelve(prev=>({...prev,tactics:(prev.tactics||[]).map((t,j)=>j===i?{...t,pct:n}:t)}));
    setEditTactic({i:-1,v:''});
  }
  function commitWeek(){
    const w=editWeek.w;if(w<0)return;
    const v=editWeek.v.trim();
    setTwelve(prev=>{
      const next={...prev,scores:{...(prev.scores||{})}};
      if(v==='')delete next.scores[w];
      else next.scores[w]=Math.max(0,Math.min(100,parseInt(v,10)||0));
      return next;
    });
    setEditWeek({w:-1,v:''});
  }

  return<div style={{display:'flex',flexDirection:'column',flex:1,minHeight:0,height:'100%'}}>
    <NavHeader eyebrow="CICLO" title="12 semanas" subtitle={cycle&&cycle.focus?`Enfoque: ${cycle.focus}`:'Sin ciclo activo'}
      right={cycle?<button onClick={endCycle} style={{padding:'6px 12px',borderRadius:9,fontSize:12,fontWeight:600,
        background:'var(--fill-1)',color:'var(--text-3)',border:'none',cursor:'pointer'}}>Terminar</button>:null}/>
    <div className="scroll zp-page" style={{flex:1,minHeight:0,paddingBottom:14}}>
      <div style={{padding:`0 ${px}px`,display:'flex',flexDirection:'column',gap:isD?14:10}}>
        {!cycle?(
          <Card radius={20} padding={isD?24:18} style={{display:'flex',flexDirection:'column',gap:14}}>
            <div>
              <div style={{fontSize:isD?15:14,fontWeight:600,color:'var(--text-1)',marginBottom:6}}>Inicia un ciclo de 12 semanas</div>
              <div style={{fontSize:isD?13:12.5,color:'var(--text-3)',lineHeight:1.5}}>
                Define tu enfoque principal y la fecha de inicio. Podrás añadir tácticas y registrar el progreso semanal.
              </div>
            </div>
            <div style={{display:'flex',flexDirection:'column',gap:8}}>
              <div style={{fontSize:11,fontWeight:600,color:'var(--text-3)',letterSpacing:0.6,textTransform:'uppercase'}}>Enfoque</div>
              <input value={focus} onChange={e=>setFocus(e.target.value)}
                placeholder="Ej. Disciplina y plan diario"
                style={{width:'100%',fontSize:14,color:'var(--text-1)',background:'var(--fill-1)',
                  border:'none',outline:'none',borderRadius:10,padding:'10px 12px'}}/>
            </div>
            <div style={{display:'flex',flexDirection:'column',gap:8}}>
              <div style={{fontSize:11,fontWeight:600,color:'var(--text-3)',letterSpacing:0.6,textTransform:'uppercase'}}>Fecha de inicio</div>
              <input type="date" value={startDate} onChange={e=>setStartDate(e.target.value)}
                style={{width:'100%',fontSize:14,color:'var(--text-1)',background:'var(--fill-1)',
                  border:'none',outline:'none',borderRadius:10,padding:'10px 12px',fontFamily:'inherit'}}/>
            </div>
            <button onClick={startCycle} disabled={!focus.trim()||!startDate}
              style={{padding:'12px',borderRadius:12,fontSize:14,fontWeight:600,
                background:focus.trim()&&startDate?'var(--accent)':'var(--fill-1)',
                color:focus.trim()&&startDate?'var(--accent-ink)':'var(--text-3)',border:'none',
                cursor:focus.trim()&&startDate?'pointer':'default'}}>
              Iniciar ciclo
            </button>
          </Card>
        ):(
          <div style={{display:isD?'grid':'flex',gridTemplateColumns:isD?'1fr 1fr':undefined,flexDirection:'column',gap:isD?14:10,alignItems:isD?'start':'stretch'}}>
            <div style={{display:'flex',flexDirection:'column',gap:isD?14:10,width:'100%'}}>
              <Card padding={0} radius={20} style={{overflow:'hidden',width:'100%'}}>
                <div style={{padding:isD?'20px':'14px 16px',background:'linear-gradient(135deg,var(--accent-soft),transparent)'}}>
                  <div style={{display:'flex',alignItems:'center',gap:isD?16:14}}>
                    <Ring value={currentWeek} max={12} size={isD?88:68} stroke={isD?9:8} color="var(--accent)">
                      <div style={{textAlign:'center'}}>
                        <div style={{fontFamily:'ui-rounded,-apple-system,system-ui',fontSize:isD?24:20,fontWeight:700,
                          color:'var(--accent)',letterSpacing:-0.8,lineHeight:1}}>{currentWeek}</div>
                        <div style={{fontSize:isD?9:8.5,color:'var(--text-3)',fontWeight:600}}>/ 12</div>
                      </div>
                    </Ring>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{fontSize:isD?12:10.5,color:'var(--text-3)',fontWeight:600,letterSpacing:0.4,textTransform:'uppercase'}}>Semana actual</div>
                      <div style={{fontFamily:'ui-rounded,-apple-system,system-ui',fontSize:isD?28:22,fontWeight:700,
                        color:'var(--text-1)',letterSpacing:-0.7,marginTop:2,lineHeight:1.05}}>Semana {currentWeek}</div>
                      <div style={{fontSize:isD?13:12,color:'var(--text-3)',marginTop:2}}>
                        Media · <span style={{color:avg!=null?(avg>=85?'var(--sys-green)':avg>=60?'var(--sys-amber)':'var(--sys-red)'):'var(--text-3)',fontWeight:600}}>{avg!=null?`${avg}%`:'—'}</span>
                      </div>
                    </div>
                  </div>
                </div>
              </Card>
              <Card padding={0} radius={20} style={{width:'100%'}}>
                <div style={{padding:isD?'14px 18px 10px':'10px 14px 6px'}}>
                  <div style={{fontSize:isD?18:13.5,fontWeight:600,color:'var(--text-1)',letterSpacing:-0.3}}>Scorecard — semana {currentWeek}</div>
                  <div style={{fontSize:isD?12:11,color:'var(--text-3)',marginTop:2}}>{tactics.length} tácticas</div>
                </div>
                {tactics.length===0?(
                  <div style={{padding:isD?'18px':'14px',borderTop:'0.5px solid var(--separator)',fontSize:isD?13:12,color:'var(--text-3)',textAlign:'center'}}>
                    Aún no has añadido tácticas.
                  </div>
                ):tactics.map((it,i)=>{
                  const col=it.pct>=80?'var(--sys-green)':it.pct>=50?'var(--sys-amber)':'var(--sys-red)';
                  const editing=editTactic.i===i;
                  return<div key={i} style={{padding:isD?'12px 18px':'10px 14px',display:'grid',gridTemplateColumns:'1fr auto auto',gap:10,
                    borderTop:'0.5px solid var(--separator)',alignItems:'center'}}>
                    <div>
                      <div style={{fontSize:isD?14:13,fontWeight:500,color:'var(--text-1)',letterSpacing:-0.15,marginBottom:isD?6:5}}>{it.t}</div>
                      <LinearProgress value={it.pct} max={100} color={col} thickness={4}/>
                    </div>
                    {editing?<input autoFocus type="number" min="0" max="100" value={editTactic.v}
                      onChange={e=>setEditTactic({i,v:e.target.value})}
                      onBlur={commitTactic}
                      onKeyDown={e=>{if(e.key==='Enter')commitTactic();if(e.key==='Escape')setEditTactic({i:-1,v:''});}}
                      style={{width:54,fontSize:13,padding:'4px 6px',borderRadius:7,
                        background:'var(--fill-1)',color:'var(--text-1)',border:'none',outline:'none',textAlign:'right',fontFamily:'inherit'}}/>
                      :<div onClick={()=>setEditTactic({i,v:String(it.pct)})}
                        style={{fontSize:isD?13:12,color:col,fontWeight:600,cursor:'pointer',padding:'2px 6px',borderRadius:6}}>{it.pct}%</div>}
                    <button onClick={()=>removeTactic(i)} aria-label="Eliminar" style={{
                      width:22,height:22,borderRadius:11,background:'var(--fill-1)',
                      color:'var(--text-3)',display:'flex',alignItems:'center',justifyContent:'center',
                      fontSize:12,fontWeight:600,cursor:'pointer',border:'none'}}>×</button>
                  </div>;
                })}
                <div style={{padding:isD?'12px 18px':'10px 14px',display:'flex',gap:8,alignItems:'center',
                  borderTop:'0.5px solid var(--separator)'}}>
                  <input value={newTactic} onChange={e=>setNewTactic(e.target.value)}
                    onKeyDown={e=>{if(e.key==='Enter')addTactic();}}
                    placeholder="Nueva táctica…"
                    style={{flex:1,fontSize:13,color:'var(--text-1)',background:'transparent',border:'none',outline:'none'}}/>
                  <button onClick={addTactic} disabled={!newTactic.trim()} style={{
                    padding:'5px 12px',borderRadius:8,fontSize:12,fontWeight:600,
                    background:newTactic.trim()?'var(--accent-soft)':'var(--fill-1)',
                    color:newTactic.trim()?'var(--accent)':'var(--text-3)',
                    cursor:newTactic.trim()?'pointer':'default',border:'none'}}>Añadir</button>
                </div>
              </Card>
            </div>
            <Card radius={20} padding={isD?18:14} style={{width:'100%'}}>
              <div style={{fontSize:isD?18:13.5,fontWeight:600,color:'var(--text-1)',letterSpacing:-0.3,marginBottom:isD?14:10}}>Progreso del ciclo</div>
              <div style={{display:'grid',gridTemplateColumns:'repeat(6,1fr)',gap:isD?10:6}}>
                {weeks.map(w=>{
                  const col=w.score===null?'var(--fill-2)':w.score>=85?'var(--sys-green)':w.score>=60?'var(--sys-amber)':'var(--sys-red)';
                  const soft=w.score===null?'var(--fill-1)':w.score>=85?'var(--sys-green-soft)':w.score>=60?'var(--sys-amber-soft)':'var(--sys-red-soft)';
                  const editing=editWeek.w===w.w;
                  return<div key={w.w} onClick={()=>{if(!editing)setEditWeek({w:w.w,v:w.score!=null?String(w.score):''});}}
                    style={{aspectRatio:'1',background:w.score!==null?soft:'var(--fill-1)',
                    border:w.current?`1.5px solid ${col}`:'0.5px solid var(--separator)',borderRadius:11,cursor:'pointer',
                    display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:1}}>
                    <div style={{fontSize:isD?10:9.5,color:'var(--text-3)',fontWeight:500,lineHeight:1}}>S{w.w}</div>
                    {editing?<input autoFocus type="number" min="0" max="100" value={editWeek.v}
                      onClick={e=>e.stopPropagation()}
                      onChange={e=>setEditWeek({w:w.w,v:e.target.value})}
                      onBlur={commitWeek}
                      onKeyDown={e=>{if(e.key==='Enter')commitWeek();if(e.key==='Escape')setEditWeek({w:-1,v:''});}}
                      style={{width:'80%',fontSize:isD?13:11,padding:'2px',borderRadius:5,fontFamily:'ui-rounded,-apple-system,system-ui',
                        background:'transparent',color:col,fontWeight:700,border:'none',outline:'none',textAlign:'center'}}/>
                    :<div style={{fontFamily:'ui-rounded,-apple-system,system-ui',fontSize:isD?14:12,fontWeight:700,
                      color:w.score!==null?col:'var(--text-3)',letterSpacing:-0.3,lineHeight:1.1}}>
                      {w.score!==null?`${w.score}%`:'—'}
                    </div>}
                  </div>;
                })}
              </div>
            </Card>
          </div>
        )}
      </div>
    </div>
  </div>;
}

// ── BÓVEDA ────────────────────────────────────────────────────────────────────
const MONTHS_SHORT_ES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
function fmtMonthLong(y,m){return`${MONTHS_ES[m].charAt(0).toUpperCase()+MONTHS_ES[m].slice(1)} ${y}`;}
function expensesMonthKey(y,m){return`${y}-${String(m+1).padStart(2,'0')}`;}
function fmtMoney(n){
  const v=Number(n)||0;
  return v.toLocaleString('es-ES',{minimumFractionDigits:2,maximumFractionDigits:2})+' €';
}

function BovedaScreen({passwords,setPasswords,expenseCats,setExpenseCats,expensesRecurring,setExpensesRecurring}){
  const isD=useD();
  const[tab,setTab]=useLS('zp_boveda_tab','gastos');
  const SUBTABS=[{id:'gastos',label:'Gastos'},{id:'pwds',label:'Contraseñas'}];
  return<div style={{display:'flex',flexDirection:'column',flex:1,minHeight:0,height:'100%'}}>
    <NavHeader eyebrow="BÓVEDA" title="Privado"/>
    <div style={{padding:`0 ${isD?28:14}px ${isD?14:8}px`,flexShrink:0}}>
      <div style={{display:'flex',gap:4}} className="scroll">
        {SUBTABS.map(t=><button key={t.id} onClick={()=>setTab(t.id)} style={{
          padding:'5px 12px',borderRadius:999,flexShrink:0,
          background:tab===t.id?'var(--accent)':'var(--fill-1)',
          color:tab===t.id?'var(--accent-ink)':'var(--text-2)',
          fontSize:12.5,fontWeight:tab===t.id?600:500,letterSpacing:-0.1,border:'none',cursor:'pointer'}}>
          {t.label}
        </button>)}
      </div>
    </div>
    <div className="scroll zp-page" style={{flex:1,minHeight:0,paddingBottom:8}}>
      {tab==='gastos'&&<BovedaGastos cats={expenseCats} setCats={setExpenseCats}
        recurring={expensesRecurring} setRecurring={setExpensesRecurring}/>}
      {tab==='pwds'&&<BovedaPasswords passwords={passwords} setPasswords={setPasswords}/>}
    </div>
  </div>;
}

function BovedaGastos({cats,setCats,recurring,setRecurring}){
  const isD=useD();
  const[vm,setVm]=useState({y:TODAY.getFullYear(),m:TODAY.getMonth()});
  const monthKey=expensesMonthKey(vm.y,vm.m);
  const prevMonthKey=expensesMonthKey(vm.m===0?vm.y-1:vm.y,vm.m===0?11:vm.m-1);

  const readMonth=key=>{try{const s=localStorage.getItem('zp_exp_'+key);return s&&s!=='undefined'?JSON.parse(s):[];}catch{return[];}};
  const[expenses,setExpensesState]=useState(()=>readMonth(monthKey));
  useEffect(()=>{setExpensesState(readMonth(monthKey));},[monthKey]);

  const persistExpenses=next=>{
    setExpensesState(next);
    try{localStorage.setItem('zp_exp_'+monthKey,JSON.stringify(next));pushRemote('zp_exp_'+monthKey);}catch{}
  };

  // Auto-apply recurring expenses to this month if missing.
  useEffect(()=>{
    if(!Array.isArray(recurring)||recurring.length===0)return;
    const now=readMonth(monthKey);
    const existing=new Set(now.filter(e=>e.recurringId).map(e=>e.recurringId));
    const missing=recurring.filter(r=>!existing.has(r.id));
    if(missing.length===0)return;
    const additions=missing.map(r=>({
      id:'e'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),
      name:r.name,amount:Number(r.amount)||0,catId:r.catId,day:r.day||1,recurringId:r.id,
    }));
    const next=[...now,...additions];
    setExpensesState(next);
    try{localStorage.setItem('zp_exp_'+monthKey,JSON.stringify(next));pushRemote('zp_exp_'+monthKey);}catch{}
  },[monthKey,recurring]);

  const[adding,setAdding]=useState(false);
  const[draft,setDraft]=useState({name:'',amount:'',catId:cats[0]?.id||'other',day:String(new Date().getDate()),recurring:false});
  const[editingCats,setEditingCats]=useState(false);
  const[newCat,setNewCat]=useState({name:'',color:'#5E5CE6'});

  const total=expenses.reduce((a,e)=>a+(Number(e.amount)||0),0);
  const totalsByCat=cats.map(c=>({...c,total:expenses.filter(e=>e.catId===c.id).reduce((a,e)=>a+(Number(e.amount)||0),0)}));
  const prevTotal=readMonth(prevMonthKey).reduce((a,e)=>a+(Number(e.amount)||0),0);
  const diff=total-prevTotal;

  const addExpense=()=>{
    const n=draft.name.trim();const a=Number(draft.amount);
    if(!n||!isFinite(a)||a<=0)return;
    const id='e'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
    const newExp={id,name:n,amount:a,catId:draft.catId,day:Number(draft.day)||1};
    persistExpenses([...expenses,newExp]);
    if(draft.recurring){
      const rid='r'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
      newExp.recurringId=rid;
      persistExpenses([...expenses,newExp]);
      setRecurring(prev=>[...(prev||[]),{id:rid,name:n,amount:a,catId:draft.catId,day:Number(draft.day)||1}]);
    }
    setDraft({name:'',amount:'',catId:draft.catId,day:String(new Date().getDate()),recurring:false});
    setAdding(false);
  };
  const removeExpense=id=>persistExpenses(expenses.filter(e=>e.id!==id));
  const removeRecurring=rid=>{
    setRecurring(prev=>(prev||[]).filter(r=>r.id!==rid));
    persistExpenses(expenses.filter(e=>e.recurringId!==rid));
  };
  const addCat=()=>{
    const n=newCat.name.trim();if(!n)return;
    const id='c'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
    setCats(prev=>[...(prev||[]),{id,name:n,color:newCat.color}]);
    setNewCat({name:'',color:newCat.color});
  };
  const removeCat=id=>{
    if(!confirm('¿Eliminar categoría? Los gastos asociados quedarán sin categoría.'))return;
    setCats(prev=>(prev||[]).filter(c=>c.id!==id));
  };

  const px=isD?52:14;
  const PALETTE=['#FF6A00','#34C759','#5E5CE6','#5AC8FA','#FF2D55','#AF52DE','#8E8E93','#FF9F0A','#34C759','#5AC8FA'];
  const catName=id=>cats.find(c=>c.id===id)?.name||'Sin categoría';
  const catColor=id=>cats.find(c=>c.id===id)?.color||'var(--text-3)';
  const sortedExpenses=[...expenses].sort((a,b)=>(a.day||0)-(b.day||0));

  return<div style={{padding:`0 ${px}px`,display:'flex',flexDirection:'column',gap:14}}>
    {/* Month picker */}
    <Card padding={0} radius={20}>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'12px 14px'}}>
        <button onClick={()=>setVm(({y,m})=>m===0?{y:y-1,m:11}:{y,m:m-1})} style={{
          width:32,height:32,borderRadius:16,border:'none',background:'var(--fill-1)',
          cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',color:'var(--text-1)'}}>
          <IChev size={14} style={{transform:'scaleX(-1)'}}/>
        </button>
        <div style={{textAlign:'center'}}>
          <div style={{fontSize:11,fontWeight:600,color:'var(--text-3)',letterSpacing:0.8,textTransform:'uppercase'}}>Gastos del mes</div>
          <div style={{fontSize:17,fontWeight:700,color:'var(--text-1)',letterSpacing:-0.3,marginTop:2}}>{fmtMonthLong(vm.y,vm.m)}</div>
        </div>
        <button onClick={()=>setVm(({y,m})=>m===11?{y:y+1,m:0}:{y,m:m+1})} style={{
          width:32,height:32,borderRadius:16,border:'none',background:'var(--fill-1)',
          cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',color:'var(--text-1)'}}>
          <IChev size={14}/>
        </button>
      </div>
      <div style={{padding:'4px 18px 18px',textAlign:'center'}}>
        <div style={{fontFamily:'ui-rounded,-apple-system,system-ui',fontSize:42,fontWeight:700,
          color:'var(--text-1)',letterSpacing:-1.5,lineHeight:1}}>{fmtMoney(total)}</div>
        {prevTotal>0&&<div style={{fontSize:12,color:diff>0?'var(--sys-red)':'var(--sys-green)',marginTop:6}}>
          {diff>0?'+':''}{fmtMoney(diff)} vs {MONTHS_SHORT_ES[vm.m===0?11:vm.m-1]}
        </div>}
      </div>
    </Card>

    {/* Per-category breakdown */}
    {totalsByCat.some(c=>c.total>0)&&<Card padding={0} radius={20}>
      <div style={{padding:'14px 18px 8px',fontSize:13,fontWeight:600,color:'var(--text-1)',letterSpacing:-0.2}}>
        Por categoría
      </div>
      {totalsByCat.filter(c=>c.total>0).sort((a,b)=>b.total-a.total).map((c,i,arr)=>{
        const pct=total>0?c.total/total*100:0;
        return<div key={c.id} style={{padding:'10px 18px',
          borderTop:'0.5px solid var(--separator)',display:'flex',alignItems:'center',gap:12}}>
          <div style={{width:10,height:10,borderRadius:5,background:c.color,flexShrink:0}}/>
          <div style={{flex:1,minWidth:0}}>
            <div style={{display:'flex',justifyContent:'space-between',marginBottom:4}}>
              <div style={{fontSize:13,color:'var(--text-1)',letterSpacing:-0.15,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{c.name}</div>
              <div style={{fontSize:13,color:'var(--text-2)',fontWeight:600,fontFamily:'ui-rounded,-apple-system,system-ui'}}>{fmtMoney(c.total)}</div>
            </div>
            <div style={{height:4,background:'var(--fill-1)',borderRadius:2,overflow:'hidden'}}>
              <div style={{height:'100%',width:`${pct}%`,background:c.color,borderRadius:2,transition:'width 0.3s'}}/>
            </div>
          </div>
        </div>;
      })}
    </Card>}

    {/* Add expense */}
    {!adding?<button onClick={()=>setAdding(true)} style={{
      padding:'12px 16px',borderRadius:14,background:'var(--accent-soft)',color:'var(--accent)',
      border:'none',cursor:'pointer',fontSize:14,fontWeight:600,display:'flex',alignItems:'center',gap:8,justifyContent:'center'}}>
      <IPlus size={16}/> Añadir gasto
    </button>:<Card padding={14} radius={16}>
      <div style={{display:'flex',flexDirection:'column',gap:10}}>
        <input value={draft.name} onChange={e=>setDraft(d=>({...d,name:e.target.value}))}
          placeholder="Nombre (p. ej. Netflix)"
          style={{fontSize:14,padding:'10px 12px',background:'var(--fill-1)',border:'none',outline:'none',borderRadius:10,color:'var(--text-1)'}}/>
        <div style={{display:'flex',gap:8}}>
          <input value={draft.amount} onChange={e=>setDraft(d=>({...d,amount:e.target.value}))}
            placeholder="Importe €" inputMode="decimal" type="number" step="0.01"
            style={{flex:1,fontSize:14,padding:'10px 12px',background:'var(--fill-1)',border:'none',outline:'none',borderRadius:10,color:'var(--text-1)'}}/>
          <input value={draft.day} onChange={e=>setDraft(d=>({...d,day:e.target.value}))}
            placeholder="Día" inputMode="numeric" type="number" min="1" max="31"
            style={{width:70,fontSize:14,padding:'10px 12px',background:'var(--fill-1)',border:'none',outline:'none',borderRadius:10,color:'var(--text-1)'}}/>
        </div>
        <select value={draft.catId} onChange={e=>setDraft(d=>({...d,catId:e.target.value}))}
          style={{fontSize:14,padding:'10px 12px',background:'var(--fill-1)',border:'none',outline:'none',borderRadius:10,color:'var(--text-1)'}}>
          {cats.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}
        </select>
        <label style={{display:'flex',alignItems:'center',gap:8,fontSize:13,color:'var(--text-2)',cursor:'pointer'}}>
          <input type="checkbox" checked={draft.recurring} onChange={e=>setDraft(d=>({...d,recurring:e.target.checked}))}/>
          <IRepeat size={14}/> Gasto recurrente (se repetirá cada mes)
        </label>
        <div style={{display:'flex',gap:8,justifyContent:'flex-end'}}>
          <button onClick={()=>{setAdding(false);setDraft({name:'',amount:'',catId:cats[0]?.id||'other',day:String(new Date().getDate()),recurring:false});}}
            style={{padding:'8px 14px',borderRadius:10,background:'var(--fill-1)',color:'var(--text-2)',border:'none',cursor:'pointer',fontSize:13,fontWeight:500}}>
            Cancelar
          </button>
          <button onClick={addExpense} disabled={!draft.name.trim()||!Number(draft.amount)} style={{
            padding:'8px 14px',borderRadius:10,
            background:draft.name.trim()&&Number(draft.amount)?'var(--accent)':'var(--fill-1)',
            color:draft.name.trim()&&Number(draft.amount)?'var(--accent-ink)':'var(--text-3)',
            border:'none',cursor:draft.name.trim()&&Number(draft.amount)?'pointer':'default',fontSize:13,fontWeight:600}}>
            Añadir
          </button>
        </div>
      </div>
    </Card>}

    {/* Expense list */}
    <Card padding={0} radius={20}>
      <div style={{padding:'14px 18px 8px',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
        <div style={{fontSize:13,fontWeight:600,color:'var(--text-1)',letterSpacing:-0.2}}>Movimientos</div>
        <div style={{fontSize:11,color:'var(--text-3)'}}>{expenses.length} gasto{expenses.length===1?'':'s'}</div>
      </div>
      {sortedExpenses.length===0?<div style={{padding:'14px 18px 18px',fontSize:13,color:'var(--text-3)',textAlign:'center',
        borderTop:'0.5px solid var(--separator)'}}>Sin gastos este mes</div>
      :sortedExpenses.map(e=><div key={e.id} style={{padding:'10px 18px',display:'flex',alignItems:'center',gap:10,
        borderTop:'0.5px solid var(--separator)'}}>
        <div style={{width:36,height:36,borderRadius:10,background:catColor(e.catId)+'22',
          color:catColor(e.catId),display:'flex',alignItems:'center',justifyContent:'center',
          fontSize:11,fontWeight:700,letterSpacing:0.3,flexShrink:0}}>
          {String(e.day||1).padStart(2,'0')}
        </div>
        <div style={{flex:1,minWidth:0}}>
          <div style={{display:'flex',alignItems:'center',gap:6}}>
            <div style={{fontSize:14,color:'var(--text-1)',letterSpacing:-0.15,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{e.name}</div>
            {e.recurringId&&<span style={{display:'inline-flex',color:'var(--text-3)'}} title="Recurrente"><IRepeat size={11} sw={2}/></span>}
          </div>
          <div style={{fontSize:11,color:catColor(e.catId)}}>{catName(e.catId)}</div>
        </div>
        <div style={{fontSize:14,fontWeight:600,color:'var(--text-1)',fontFamily:'ui-rounded,-apple-system,system-ui'}}>{fmtMoney(e.amount)}</div>
        <button onClick={()=>removeExpense(e.id)} aria-label="Eliminar" style={{
          width:24,height:24,borderRadius:12,background:'var(--fill-1)',color:'var(--text-3)',
          border:'none',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',fontSize:14}}>×</button>
      </div>)}
    </Card>

    {/* Recurring expenses */}
    <Card padding={0} radius={20}>
      <div style={{padding:'14px 18px 8px',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
        <div>
          <div style={{fontSize:13,fontWeight:600,color:'var(--text-1)',letterSpacing:-0.2}}>Recurrentes</div>
          <div style={{fontSize:11,color:'var(--text-3)',marginTop:2}}>Se aplican automáticamente cada mes</div>
        </div>
        <Chip tint="var(--accent)">{(recurring||[]).length}</Chip>
      </div>
      {(recurring||[]).length===0?<div style={{padding:'12px 18px 16px',fontSize:13,color:'var(--text-3)',textAlign:'center',
        borderTop:'0.5px solid var(--separator)'}}>Sin gastos recurrentes</div>
      :(recurring||[]).map(r=><div key={r.id} style={{padding:'10px 18px',display:'flex',alignItems:'center',gap:10,
        borderTop:'0.5px solid var(--separator)'}}>
        <div style={{width:8,height:8,borderRadius:4,background:catColor(r.catId),flexShrink:0}}/>
        <div style={{flex:1,minWidth:0}}>
          <div style={{fontSize:14,color:'var(--text-1)',letterSpacing:-0.15,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{r.name}</div>
          <div style={{fontSize:11,color:'var(--text-3)'}}>Día {r.day} · {catName(r.catId)}</div>
        </div>
        <div style={{fontSize:13,color:'var(--text-2)',fontFamily:'ui-rounded,-apple-system,system-ui'}}>{fmtMoney(r.amount)}</div>
        <button onClick={()=>removeRecurring(r.id)} aria-label="Quitar recurrente" style={{
          width:24,height:24,borderRadius:12,background:'var(--fill-1)',color:'var(--text-3)',
          border:'none',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',fontSize:14}}>×</button>
      </div>)}
    </Card>

    {/* Categories management */}
    <Card padding={0} radius={20}>
      <button onClick={()=>setEditingCats(v=>!v)} style={{
        padding:'14px 18px',display:'flex',justifyContent:'space-between',alignItems:'center',width:'100%',
        background:'transparent',border:'none',cursor:'pointer',color:'var(--text-1)'}}>
        <div style={{fontSize:13,fontWeight:600,letterSpacing:-0.2}}>Categorías ({cats.length})</div>
        <div style={{transform:editingCats?'rotate(90deg)':'rotate(0deg)',transition:'transform 0.15s',color:'var(--text-3)'}}>
          <IChev size={14}/>
        </div>
      </button>
      {editingCats&&<>
        {cats.map(c=><div key={c.id} style={{padding:'10px 18px',display:'flex',alignItems:'center',gap:10,
          borderTop:'0.5px solid var(--separator)'}}>
          <div style={{width:14,height:14,borderRadius:7,background:c.color,flexShrink:0}}/>
          <input value={c.name} onChange={e=>setCats(prev=>prev.map(x=>x.id===c.id?{...x,name:e.target.value}:x))}
            style={{flex:1,fontSize:14,background:'transparent',border:'none',outline:'none',color:'var(--text-1)',fontFamily:'inherit'}}/>
          <input type="color" value={c.color} onChange={e=>setCats(prev=>prev.map(x=>x.id===c.id?{...x,color:e.target.value}:x))}
            style={{width:28,height:28,border:'none',background:'transparent',cursor:'pointer'}}/>
          <button onClick={()=>removeCat(c.id)} style={{
            width:24,height:24,borderRadius:12,background:'var(--fill-1)',color:'var(--text-3)',
            border:'none',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',fontSize:14}}>×</button>
        </div>)}
        <div style={{padding:'12px 18px',display:'flex',alignItems:'center',gap:8,borderTop:'0.5px solid var(--separator)'}}>
          <input value={newCat.name} onChange={e=>setNewCat(d=>({...d,name:e.target.value}))}
            onKeyDown={e=>{if(e.key==='Enter')addCat();}}
            placeholder="Nueva categoría"
            style={{flex:1,fontSize:14,padding:'8px 10px',background:'var(--fill-1)',border:'none',outline:'none',borderRadius:8,color:'var(--text-1)'}}/>
          <input type="color" value={newCat.color} onChange={e=>setNewCat(d=>({...d,color:e.target.value}))}
            style={{width:32,height:32,border:'none',background:'transparent',cursor:'pointer'}}/>
          <button onClick={addCat} disabled={!newCat.name.trim()} style={{
            padding:'8px 14px',borderRadius:10,
            background:newCat.name.trim()?'var(--accent)':'var(--fill-1)',
            color:newCat.name.trim()?'var(--accent-ink)':'var(--text-3)',
            border:'none',cursor:newCat.name.trim()?'pointer':'default',fontSize:13,fontWeight:600}}>
            Añadir
          </button>
        </div>
      </>}
    </Card>
  </div>;
}

function BovedaPasswords({passwords,setPasswords}){
  const isD=useD();
  const[search,setSearch]=useState('');
  const[expanded,setExpanded]=useState({});       // groupId -> bool
  const[revealAcc,setRevealAcc]=useState(null);   // accountId currently revealed
  const[addingGroup,setAddingGroup]=useState(false);
  const[newGroupTitle,setNewGroupTitle]=useState('');
  const[addingAccTo,setAddingAccTo]=useState(null); // groupId currently in "new account" mode
  const[accDraft,setAccDraft]=useState({label:'',user:'',pwd:'',url:'',note:''});

  // Migración: si hay entradas planas heredadas (con .pwd y sin .accounts), las envolvemos como grupo con 1 cuenta.
  React.useEffect(()=>{
    const list=Array.isArray(passwords)?passwords:[];
    if(list.length===0)return;
    const needs=list.some(p=>!Array.isArray(p.accounts));
    if(!needs)return;
    const migrated=list.map(p=>{
      if(Array.isArray(p.accounts))return p;
      return{
        id:p.id||('g'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)),
        title:p.title||'Sin nombre',
        accounts:[{
          id:'a'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),
          label:p.user||'Cuenta',
          user:p.user||'',pwd:p.pwd||'',url:p.url||'',note:p.note||'',
        }],
      };
    });
    setPasswords(migrated);
  },[]); // solo al montar

  const groups=(Array.isArray(passwords)?passwords:[]).filter(g=>Array.isArray(g.accounts));
  const q=search.trim().toLowerCase();
  const matchAcc=a=>!q||(a.label||'').toLowerCase().includes(q)||(a.user||'').toLowerCase().includes(q)||(a.url||'').toLowerCase().includes(q);
  const filtered=q
    ?groups.map(g=>{
        const titleHit=(g.title||'').toLowerCase().includes(q);
        const accs=titleHit?g.accounts:g.accounts.filter(matchAcc);
        return accs.length||titleHit?{...g,accounts:accs}:null;
      }).filter(Boolean)
    :groups;

  const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);

  const addGroup=()=>{
    const t=newGroupTitle.trim();if(!t)return;
    const id=uid('g');
    setPasswords(prev=>[...(prev||[]),{id,title:t,accounts:[]}]);
    setExpanded(e=>({...e,[id]:true}));
    setAddingAccTo(id);
    setNewGroupTitle('');setAddingGroup(false);
  };
  const updateGroup=(gid,patch)=>setPasswords(prev=>(prev||[]).map(g=>g.id===gid?{...g,...patch}:g));
  const removeGroup=gid=>{
    if(!confirm('¿Eliminar este apartado y todas sus cuentas?'))return;
    setPasswords(prev=>(prev||[]).filter(g=>g.id!==gid));
  };
  const addAccount=gid=>{
    if(!accDraft.label.trim()&&!accDraft.user.trim())return;
    const acc={id:uid('a'),...accDraft,label:accDraft.label.trim()||accDraft.user.trim()};
    setPasswords(prev=>(prev||[]).map(g=>g.id===gid?{...g,accounts:[...(g.accounts||[]),acc]}:g));
    setAccDraft({label:'',user:'',pwd:'',url:'',note:''});
    setAddingAccTo(null);
  };
  const updateAccount=(gid,aid,patch)=>setPasswords(prev=>(prev||[]).map(g=>
    g.id===gid?{...g,accounts:g.accounts.map(a=>a.id===aid?{...a,...patch}:a)}:g));
  const removeAccount=(gid,aid)=>{
    if(!confirm('¿Eliminar esta cuenta?'))return;
    setPasswords(prev=>(prev||[]).map(g=>g.id===gid?{...g,accounts:g.accounts.filter(a=>a.id!==aid)}:g));
  };
  const copy=async t=>{if(!t)return;try{await navigator.clipboard.writeText(t);}catch{}};

  const px=isD?52:14;
  const inputCSS={fontSize:14,padding:'10px 12px',background:'var(--fill-1)',border:'none',outline:'none',borderRadius:10,color:'var(--text-1)',fontFamily:'inherit'};
  const iconBtn=(color)=>({width:30,height:30,borderRadius:8,background:'var(--fill-1)',border:'none',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',color:color||'var(--text-2)',flexShrink:0});

  return<div style={{padding:`0 ${px}px`,display:'flex',flexDirection:'column',gap:14}}>
    <div style={{padding:'10px 14px',borderRadius:12,background:'var(--sys-amber-soft)',
      border:'0.5px solid var(--sys-amber)',display:'flex',gap:10,alignItems:'flex-start'}}>
      <span style={{color:'var(--sys-amber)',display:'flex',marginTop:1}}><IVault size={14} sw={1.8}/></span>
      <div style={{fontSize:12,color:'var(--text-2)',lineHeight:1.5}}>
        Las contraseñas se guardan en tu dispositivo y se sincronizan con tu cuenta. <strong>No es cifrado de extremo a extremo</strong> — usa esto para credenciales no críticas.
      </div>
    </div>

    <Card padding={0} radius={14}>
      <div style={{display:'flex',alignItems:'center',gap:8,padding:'10px 14px'}}>
        <span style={{color:'var(--text-3)',display:'flex'}}><ISearch size={16}/></span>
        <input value={search} onChange={e=>setSearch(e.target.value)}
          placeholder="Buscar apartado o cuenta…"
          style={{flex:1,fontSize:14,background:'transparent',border:'none',outline:'none',color:'var(--text-1)',fontFamily:'inherit'}}/>
      </div>
    </Card>

    {!addingGroup?<button onClick={()=>setAddingGroup(true)} style={{
      padding:'12px 16px',borderRadius:14,background:'var(--accent-soft)',color:'var(--accent)',
      border:'none',cursor:'pointer',fontSize:14,fontWeight:600,display:'flex',alignItems:'center',gap:8,justifyContent:'center'}}>
      <IPlus size={16}/> Nuevo apartado
    </button>:<Card padding={14} radius={16}>
      <div style={{display:'flex',flexDirection:'column',gap:10}}>
        <input value={newGroupTitle} onChange={e=>setNewGroupTitle(e.target.value)}
          onKeyDown={e=>e.key==='Enter'&&addGroup()}
          placeholder="Nombre del apartado (p. ej. Netflix, Gmail)" autoFocus style={inputCSS}/>
        <div style={{display:'flex',gap:8,justifyContent:'flex-end'}}>
          <button onClick={()=>{setAddingGroup(false);setNewGroupTitle('');}}
            style={{padding:'8px 14px',borderRadius:10,background:'var(--fill-1)',color:'var(--text-2)',border:'none',cursor:'pointer',fontSize:13,fontWeight:500}}>
            Cancelar
          </button>
          <button onClick={addGroup} disabled={!newGroupTitle.trim()} style={{
            padding:'8px 14px',borderRadius:10,
            background:newGroupTitle.trim()?'var(--accent)':'var(--fill-1)',
            color:newGroupTitle.trim()?'var(--accent-ink)':'var(--text-3)',
            border:'none',cursor:newGroupTitle.trim()?'pointer':'default',fontSize:13,fontWeight:600}}>
            Crear
          </button>
        </div>
      </div>
    </Card>}

    {filtered.length===0?<div style={{padding:'20px',fontSize:13,color:'var(--text-3)',textAlign:'center'}}>
      {q?'Sin resultados':'Sin apartados todavía'}
    </div>:filtered.map(g=>{
      const isOpen=!!expanded[g.id]||!!q;
      const addingHere=addingAccTo===g.id;
      return<Card key={g.id} padding={0} radius={16}>
        <div style={{display:'flex',alignItems:'center',gap:10,padding:'12px 14px',cursor:'pointer'}}
          onClick={()=>setExpanded(e=>({...e,[g.id]:!isOpen}))}>
          <div style={{width:34,height:34,borderRadius:8,background:'var(--accent-soft)',color:'var(--accent)',
            display:'flex',alignItems:'center',justifyContent:'center',fontWeight:700,fontSize:14,flexShrink:0}}>
            {(g.title||'?').charAt(0).toUpperCase()}
          </div>
          <div style={{flex:1,minWidth:0}}>
            <div style={{fontSize:14,fontWeight:600,color:'var(--text-1)',letterSpacing:-0.15,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{g.title}</div>
            <div style={{fontSize:12,color:'var(--text-3)'}}>{g.accounts.length} {g.accounts.length===1?'cuenta':'cuentas'}</div>
          </div>
          <button onClick={e=>{e.stopPropagation();removeGroup(g.id);}} aria-label="Eliminar apartado"
            style={iconBtn('var(--sys-red)')}>×</button>
          <span style={{color:'var(--text-3)',display:'flex',transform:isOpen?'rotate(90deg)':'none',transition:'transform .15s'}}>
            <IChev size={16}/>
          </span>
        </div>

        {isOpen&&<div style={{borderTop:'0.5px solid var(--separator)',display:'flex',flexDirection:'column'}}>
          {g.accounts.length===0&&!addingHere&&<div style={{padding:'14px',fontSize:12,color:'var(--text-3)',textAlign:'center',fontStyle:'italic'}}>
            Sin cuentas en este apartado
          </div>}

          {g.accounts.map(a=>{
            const open=revealAcc===a.id;
            return<div key={a.id} style={{padding:'12px 14px',borderTop:'0.5px solid var(--separator)'}}>
              <div style={{display:'flex',alignItems:'center',gap:8}}>
                <div style={{width:28,height:28,borderRadius:14,background:'var(--fill-1)',color:'var(--text-2)',
                  display:'flex',alignItems:'center',justifyContent:'center',fontWeight:600,fontSize:12,flexShrink:0}}>
                  {(a.label||a.user||'?').charAt(0).toUpperCase()}
                </div>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontSize:13.5,fontWeight:600,color:'var(--text-1)',letterSpacing:-0.1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{a.label||'Sin nombre'}</div>
                  {a.user&&<div style={{fontSize:11.5,color:'var(--text-3)',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{a.user}</div>}
                </div>
                <button onClick={()=>setRevealAcc(open?null:a.id)} style={iconBtn()} aria-label="Ver">
                  {open?<IEyeOff size={15}/>:<IEye size={15}/>}
                </button>
                <button onClick={()=>copy(a.pwd)} style={iconBtn()} aria-label="Copiar contraseña">
                  <ICopy size={14}/>
                </button>
                <button onClick={()=>removeAccount(g.id,a.id)} style={iconBtn('var(--sys-red)')} aria-label="Eliminar cuenta">×</button>
              </div>
              {open&&<div style={{marginTop:10,paddingTop:10,borderTop:'0.5px solid var(--separator)',display:'flex',flexDirection:'column',gap:8}}>
                <div style={{display:'flex',alignItems:'center',gap:8}}>
                  <div style={{fontSize:11,color:'var(--text-3)',textTransform:'uppercase',letterSpacing:0.5,minWidth:70}}>Nombre</div>
                  <input value={a.label||''} onChange={e=>updateAccount(g.id,a.id,{label:e.target.value})}
                    placeholder="Nico, Papi…"
                    style={{flex:1,fontSize:13,padding:'6px 10px',background:'var(--fill-1)',border:'none',outline:'none',borderRadius:8,color:'var(--text-1)'}}/>
                </div>
                <div style={{display:'flex',alignItems:'center',gap:8}}>
                  <div style={{fontSize:11,color:'var(--text-3)',textTransform:'uppercase',letterSpacing:0.5,minWidth:70}}>Usuario</div>
                  <input value={a.user||''} onChange={e=>updateAccount(g.id,a.id,{user:e.target.value})}
                    placeholder="correo o usuario"
                    style={{flex:1,fontSize:13,padding:'6px 10px',background:'var(--fill-1)',border:'none',outline:'none',borderRadius:8,color:'var(--text-1)'}}/>
                </div>
                <div style={{display:'flex',alignItems:'center',gap:8}}>
                  <div style={{fontSize:11,color:'var(--text-3)',textTransform:'uppercase',letterSpacing:0.5,minWidth:70}}>Contraseña</div>
                  <input value={a.pwd||''} onChange={e=>updateAccount(g.id,a.id,{pwd:e.target.value})}
                    style={{flex:1,fontSize:13,padding:'6px 10px',background:'var(--fill-1)',border:'none',outline:'none',borderRadius:8,color:'var(--text-1)',fontFamily:'ui-monospace,SF Mono'}}/>
                </div>
                <div style={{display:'flex',alignItems:'center',gap:8}}>
                  <div style={{fontSize:11,color:'var(--text-3)',textTransform:'uppercase',letterSpacing:0.5,minWidth:70}}>URL</div>
                  <input value={a.url||''} onChange={e=>updateAccount(g.id,a.id,{url:e.target.value})}
                    placeholder="https://…"
                    style={{flex:1,fontSize:13,padding:'6px 10px',background:'var(--fill-1)',border:'none',outline:'none',borderRadius:8,color:'var(--text-1)'}}/>
                </div>
                <div style={{display:'flex',alignItems:'flex-start',gap:8}}>
                  <div style={{fontSize:11,color:'var(--text-3)',textTransform:'uppercase',letterSpacing:0.5,minWidth:70,marginTop:6}}>Nota</div>
                  <textarea value={a.note||''} onChange={e=>updateAccount(g.id,a.id,{note:e.target.value})}
                    placeholder="—" rows={2}
                    style={{flex:1,fontSize:13,padding:'6px 10px',background:'var(--fill-1)',border:'none',outline:'none',borderRadius:8,color:'var(--text-1)',fontFamily:'inherit',resize:'vertical'}}/>
                </div>
              </div>}
            </div>;

const CONTENT_TYPES=[

];
function contentHost(url){
  try{return new URL(url).hostname.replace(/^www\./,'');}catch{return'';}
}
function contentUrlInfo(url){
  const clean=normalizeUrl(url);
  let u=null;
  try{u=new URL(clean);}catch{}
  const host=(u?.hostname||'').replace(/^www\./,'').toLowerCase();
  const path=(u?.pathname||'').toLowerCase();
  const base={platform:host||'Enlace',format:'Enlace',type:inferContentType(clean),host};
  if(/youtu\.be|youtube\.com|youtube-nocookie\.com/.test(host)){
    const isShort=path.startsWith('/shorts/');
    return{...base,platform:'YouTube',format:isShort?'Short':'Vídeo',type:'video'};
  }
  if(/tiktok\.com/.test(host))return{...base,platform:'TikTok',format:'Vídeo corto',type:'video'};
  if(/instagram\.com/.test(host)){
    const format=path.startsWith('/reel/')?'Reel':path.startsWith('/p/')?'Publicación':path.startsWith('/stories/')?'Historia':'Instagram';
    return{...base,platform:'Instagram',format,type:'video'};
  }
  if(/(^|\.)reddit\.com$|redd\.it$/.test(host))return{...base,platform:'Reddit',format:'Post',type:'articulo'};
  if(/vimeo\.com/.test(host))return{...base,platform:'Vimeo',format:'Vídeo',type:'video'};
  if(/spotify|podcasts|ivoox|apple/.test(host))return{...base,platform:host.includes('spotify')?'Spotify':host,format:'Podcast',type:'podcast'};
  if(/udemy|coursera|domestika|skillshare/.test(host))return{...base,platform:host,format:'Curso',type:'curso'};
  return base;
}
function inferContentType(url){
  const h=contentHost(url);
  if(/youtube|youtu\.be|tiktok|vimeo|instagram/.test(h))return'video';
  if(/reddit|redd\.it/.test(h))return'articulo';
  if(/spotify|podcasts|ivoox|apple/.test(h))return'podcast';
  if(/udemy|coursera|domestika|skillshare/.test(h))return'curso';
  return'articulo';
}
function humanTitlePart(part){
  const clean=decodeURIComponent(String(part||'')).replace(/[-_]+/g,' ').replace(/\s+/g,' ').trim();
  if(!clean||/^[a-z0-9]{4,10}$/i.test(clean))return'';
  return clean.charAt(0).toUpperCase()+clean.slice(1);
}
function redditTitleFromUrl(url){
  try{
    const u=new URL(normalizeUrl(url));
    const host=u.hostname.replace(/^www\./,'').toLowerCase();
    if(!/(^|\.)reddit\.com$|redd\.it$/.test(host))return'';
    const parts=u.pathname.split('/').filter(Boolean);
    const commentsIdx=parts.findIndex(p=>p.toLowerCase()==='comments');
    if(commentsIdx>=0)return humanTitlePart(parts[commentsIdx+2]||'');
    return humanTitlePart(parts[parts.length-1]||'');
  }catch{}
  return'';
}
function readableTitleFromUrl(url,info=contentUrlInfo(url)){
  const redditTitle=redditTitleFromUrl(url);
  if(redditTitle)return redditTitle;
  try{
    const u=new URL(normalizeUrl(url));
    const parts=u.pathname.split('/').filter(Boolean);
    const title=humanTitlePart(parts[parts.length-1]||parts[0]||'');
    if(title)return title;
  }catch{}
  return `${info.format} de ${info.platform}`;
}
function fallbackContentDescription(url,info=contentUrlInfo(url)){
  const host=contentHost(url);
  if(info.type==='video')return `${info.format} guardado desde ${info.platform}.`;
  if(info.type==='podcast')return `Podcast guardado desde ${info.platform||host}.`;
  if(info.type==='curso')return `Curso guardado desde ${info.platform||host}.`;
  return host?`Enlace guardado desde ${host}.`:'Contenido guardado desde URL.';
}

];
function normalizeForTopic(text){
  return String(text||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,' ');
}
function inferContentTopic(text,info=contentUrlInfo('')){
  const haystack=normalizeForTopic(`${text||''} ${info.host||''} ${info.platform||''} ${info.format||''}`);
  const found=CONTENT_TOPIC_RULES.find(rule=>rule.words.some(w=>haystack.includes(normalizeForTopic(w))));
  if(found)return found.topic;
  if(info.type==='podcast')return'Podcast';
  if(info.type==='curso')return'Educación';
  if(info.type==='video')return'Vídeos';
  return'Lectura';
}
function looksEnglish(text){
  const t=` ${normalizeForTopic(text)} `;
  const hits=[
    ' the ',' and ',' how ',' to ',' for ',' with ',' without ',' why ',' what ',' this ',' that ',
    ' your ',' you ',' my ',' best ',' guide ',' tips ',' from ',' he ',' she ',' his ',' her ',
    ' they ',' their ',' on ',' in ',' of ',' is ',' are ',' was ',' were ',' open sourced ',
    ' open-source ',' stars ',' github ',' claude folder '
  ]
    .filter(w=>t.includes(w)).length;
  const commonVerb=/\b(opened|built|made|created|launched|learned|explained|revealed|shared|changed|fixed|used|uses)\b/.test(t);
  const hasEnglishContraction=/\b(can't|won't|don't|doesn't|i'm|you're|it's|that's)\b/i.test(String(text||''));
  return hits>=2||hasEnglishContraction||(hits>=1&&commonVerb);
}
function looksSpanish(text){
  const raw=String(text||'');
  if(/[áéíóúüñ¿¡]/i.test(raw))return true;
  const t=` ${normalizeForTopic(raw)} `;
  if(/\b(post|enlace|articulo|artículo|video|vídeo|podcast|curso|otro)\s+sobre\b/i.test(raw))return true;
  const hits=[
    ' el ',' la ',' los ',' las ',' que ',' del ',' con ',' para ',' por ',' como ',' sobre ',
    ' una ',' un ',' todo ',' todos ',' necesitas ',' saber ',' libro ',' carrera ',' ingeniero ',
    ' datos ',' minutos ',' inteligencia ',' artificial ',' crear ',' sistema ',' aprender ',' idiomas ',
    ' estrategia ',' cuantitativo ',' reglas ',' mental ',' cuenta ',' cuentas ',' calendario '
  ].filter(w=>t.includes(w)).length;
  return hits>=2;
}
function shouldTranslateToSpanish(text){
  const clean=polishSpanishText(text);
  if(!clean)return false;
  return looksEnglish(clean)||!looksSpanish(clean);
}
function spanishGenericTitle(url,info=contentUrlInfo(url),topic=inferContentTopic(url,info)){
  return `${info.format} sobre ${topic}`;
}
function polishSpanishText(text){
  return String(text||'').replace(/\s+/g,' ').trim();
}
function localSpanishFallback(text,url,info=contentUrlInfo(url),topic=inferContentTopic(`${url} ${text}`,info)){
  const clean=polishSpanishText(text);
  if(!clean)return spanishGenericTitle(url,info,topic);
  if(!shouldTranslateToSpanish(clean))return clean;
  return spanishGenericTitle(url,info,topic);
}
async function translateToSpanish(text,url,info=contentUrlInfo(url),topic=inferContentTopic(`${url} ${text}`,info)){
  const clean=polishSpanishText(text);
  if(!clean)return spanishGenericTitle(url,info,topic);
  if(!shouldTranslateToSpanish(clean))return clean;
  try{
    const res=await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(clean.slice(0,450))}&langpair=en|es`);
    if(!res.ok)throw new Error('translate failed');
    const data=await res.json();
    const translated=polishSpanishText(data?.responseData?.translatedText||'');
    if(translated&&translated.toLowerCase()!==clean.toLowerCase()&&!shouldTranslateToSpanish(translated))return translated;
  }catch{}
  return spanishGenericTitle(url,info,topic);
}
async function spanishTitleForContent(text,url,info=contentUrlInfo(url),topic=inferContentTopic(`${url} ${text}`,info)){
  return translateToSpanish(text,url,info,topic);
}
async function fetchContentMetadata(url){
  const clean=normalizeUrl(url);
  const info=contentUrlInfo(clean);
  const endpoints=[];
  if(info.platform==='YouTube')endpoints.push(`https://www.youtube.com/oembed?format=json&url=${encodeURIComponent(clean)}`);
  if(info.platform==='Vimeo')endpoints.push(`https://vimeo.com/api/oembed.json?url=${encodeURIComponent(clean)}`);
  if(info.platform==='TikTok')endpoints.push(`https://www.tiktok.com/oembed?url=${encodeURIComponent(clean)}`);
  if(info.platform==='Reddit')endpoints.push(`https://www.reddit.com/oembed?url=${encodeURIComponent(clean)}`);
  for(const endpoint of endpoints){
    try{
      const res=await fetch(endpoint);
      if(!res.ok)continue;
      const data=await res.json();
      const title=(data.title||'').trim();
      const author=(data.author_name||'').trim();
      const topic=inferContentTopic(`${clean} ${title} ${author}`,info);
      const titleEs=await translateToSpanish(title||readableTitleFromUrl(clean,info),clean,info,topic);
      return{
        title:titleEs,
        description:author
          ?`${info.format} de ${author} en ${info.platform}. Categoría: ${topic}.`
          :`${fallbackContentDescription(clean,info)} Categoría: ${topic}.`,
        topic,
        thumbnail:data.thumbnail_url||'',
      };
    }catch{}
  }
  const fallbackTitle=readableTitleFromUrl(clean,info);
  const topic=inferContentTopic(`${clean} ${fallbackTitle}`,info);
  const fallbackTitleEs=await translateToSpanish(fallbackTitle,clean,info,topic);
  return{
    title:fallbackTitleEs,
    description:`${fallbackContentDescription(clean,info)} Categoría: ${topic}.`,
    topic,
    thumbnail:'',
  };
}
function normalizeUrl(url){
  const v=(url||'').trim();
  if(!v)return'';
  if(/^https?:\/\//i.test(v))return v;
  return`https://${v}`;
}
function isGenericContentTitle(item,info=contentUrlInfo(item?.url||'')){
  const title=polishSpanishText(item?.title||'');
  const host=contentHost(item?.url||'');
  if(!title)return true;
  if(title===`${info.format} de ${info.platform}`)return true;
  if(host&&title.toLowerCase()===`enlace de ${host}`.toLowerCase())return true;
  return info.platform==='Reddit'&&/^enlace de reddit\.com$/i.test(title);
}
function ContentScreen({library,setLibrary,embedded=false}){
  const isD=useD();
  const[adding,setAdding]=useState(false);
  const[filter,setFilter]=useState('todos');
  const[url,setUrl]=useState('');
  const[title,setTitle]=useState('');
  const[topic,setTopic]=useState('');
  const[note,setNote]=useState('');
  const[type,setType]=useState('video');
  const[tags,setTags]=useState('');
  const[editingItem,setEditingItem]=useState(null);
  const[metaLoading,setMetaLoading]=useState(false);
  const[metaError,setMetaError]=useState('');
  const px=isD?52:14;
  const cleanDraftUrl=normalizeUrl(url);
  const draftInfo=useMemo(()=>contentUrlInfo(cleanDraftUrl),[cleanDraftUrl]);
  const items=(library||[]).slice().sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
  const topics=Array.from(new Set(items.map(x=>(x.topic||'').trim()).filter(Boolean))).sort((a,b)=>a.localeCompare(b,'es'));
  const shown=filter==='todos'?items:items.filter(x=>x.type===filter||x.status===filter||`tema:${x.topic}`===filter);
  const counts={
    todos:items.length,
    pendiente:items.filter(x=>x.status!=='visto').length,
    favorito:items.filter(x=>x.status==='favorito').length,
    video:items.filter(x=>x.type==='video').length,
  };
  useEffect(()=>{
    const clean=normalizeUrl(url);
    if(!clean){setTitle('');setNote('');setTopic('');setType('video');setTags('');setMetaError('');return;}
    const info=contentUrlInfo(clean);
    const inferredTopic=inferContentTopic(`${clean} ${readableTitleFromUrl(clean,info)}`,info);
    setType(info.type);
    setTopic(inferredTopic);
    setTags([info.platform,info.format,inferredTopic].filter(Boolean).join(', '));
    setTitle(localSpanishFallback(readableTitleFromUrl(clean,info),clean,info,inferredTopic));
    setNote(`${fallbackContentDescription(clean,info)} Categoría: ${inferredTopic}.`);
    let cancelled=false;
    setMetaLoading(true);
    setMetaError('');
    const timer=setTimeout(()=>{
      fetchContentMetadata(clean).then(meta=>{
        if(cancelled)return;
        setTitle(meta.title||readableTitleFromUrl(clean,info));
        setNote(meta.description||fallbackContentDescription(clean,info));
        const nextTopic=meta.topic||inferContentTopic(`${clean} ${meta.title||''} ${meta.description||''}`,info);
        setTopic(nextTopic);
        setTags([info.platform,info.format,nextTopic].filter(Boolean).join(', '));
      }).catch(()=>{
        if(!cancelled)setMetaError('No pude leer metadatos externos; usé la URL.');
      }).finally(()=>{if(!cancelled)setMetaLoading(false);});
    },450);
    return()=>{cancelled=true;clearTimeout(timer);};
  },[url]);
  useEffect(()=>{
    const candidates=(library||[]).filter(item=>
      item&&item.url&&item.title&&shouldTranslateToSpanish(item.title)
    ).slice(0,5);
    if(candidates.length===0)return;
    let cancelled=false;
    (async()=>{
      const updates={};
      for(const item of candidates){
        const clean=normalizeUrl(item.url);
        const info=contentUrlInfo(clean);
        const topic=item.topic||inferContentTopic(`${clean} ${item.title} ${item.note||''}`,info);
        const translated=await spanishTitleForContent(item.title,clean,info,topic);
        if(cancelled)return;
        if(!translated||translated===polishSpanishText(item.title||''))continue;
        updates[item.id]={
          title:translated,
          titleAutoEs:true,
          topic,
          tags:Array.from(new Set([info.platform,info.format,topic,...(Array.isArray(item.tags)?item.tags:[])]
            .map(t=>String(t||'').trim()).filter(Boolean))),
        };
      }
      if(cancelled||Object.keys(updates).length===0)return;
      setLibrary(prev=>(prev||[]).map(item=>updates[item.id]?{...item,...updates[item.id],updatedAt:Date.now()}:item));
    })();
    return()=>{cancelled=true;};
  },[library,setLibrary]);
  useEffect(()=>{
    const candidates=(library||[]).filter(item=>{
      if(!item||!item.url||!isGenericContentTitle(item))return false;
      const info=contentUrlInfo(item.url);
      return info.platform==='Reddit'||!!redditTitleFromUrl(item.url);
    }).slice(0,5);
    if(candidates.length===0)return;
    let cancelled=false;
    (async()=>{
      const updates={};
      for(const item of candidates){
        const clean=normalizeUrl(item.url);
        const info=contentUrlInfo(clean);
        const meta=await fetchContentMetadata(clean);
        if(cancelled)return;
        const nextTitle=polishSpanishText(meta.title||readableTitleFromUrl(clean,info));
        if(!nextTitle||nextTitle===polishSpanishText(item.title||'')||isGenericContentTitle({...item,title:nextTitle},info))continue;
        const nextTopic=meta.topic||item.topic||inferContentTopic(`${clean} ${nextTitle} ${item.note||''}`,info);
        updates[item.id]={
          title:nextTitle,
          titleAutoEs:true,
          platform:info.platform,
          format:info.format,
          type:info.type,
          topic:nextTopic,
          note:meta.description||item.note||`${fallbackContentDescription(clean,info)} Categoría: ${nextTopic}.`,
          tags:Array.from(new Set([info.platform,info.format,nextTopic,...(Array.isArray(item.tags)?item.tags:[])]
            .map(t=>String(t||'').trim()).filter(Boolean))),
        };
      }
      if(cancelled||Object.keys(updates).length===0)return;
      setLibrary(prev=>(prev||[]).map(item=>updates[item.id]?{...item,...updates[item.id],updatedAt:Date.now()}:item));
    })();
    return()=>{cancelled=true;};
  },[library,setLibrary]);
  function resetForm(){
    setUrl('');setTitle('');setTopic('');setNote('');setType('video');setTags('');
    setMetaLoading(false);setMetaError('');
  }
  function addContent(){
    const cleanUrl=normalizeUrl(url);
    if(!cleanUrl)return;
    const info=contentUrlInfo(cleanUrl);
    const finalTopic=topic.trim()||inferContentTopic(`${cleanUrl} ${title} ${note}`,info);
    const cleanTitle=title.trim()||spanishGenericTitle(cleanUrl,info,finalTopic);
    const finalType=type||info.type;
    const autoTags=[info.platform,info.format,finalTopic,...tags.split(',')].map(t=>String(t||'').trim()).filter(Boolean);
    setLibrary(prev=>[{
      id:'c'+Date.now(),
      title:cleanTitle,
      url:cleanUrl,
      topic:finalTopic,
      note:note.trim()||`${fallbackContentDescription(cleanUrl,info)} Categoría: ${finalTopic}.`,
      type:finalType,
      platform:info.platform,
      format:info.format,
      titleAutoEs:true,
      status:'pendiente',
      tags:Array.from(new Set(autoTags)),
      createdAt:Date.now(),
    },...(prev||[])]);
    resetForm();setAdding(false);
  }
  function patchItem(id,patch){setLibrary(prev=>(prev||[]).map(x=>x.id===id?{...x,...patch,updatedAt:Date.now()}:x));}
  function removeItem(id){setLibrary(prev=>(prev||[]).filter(x=>x.id!==id));}
  function openItem(item){if(item.url)window.open(item.url,'_blank','noopener,noreferrer');}
  function startEditItem(item){
    setEditingItem({
      id:item.id,
      title:item.title||'',
      url:item.url||'',
      topic:item.topic||'',
      note:item.note||'',
      type:item.type||'articulo',
      status:item.status||'pendiente',
      tags:Array.isArray(item.tags)?item.tags.join(', '):'',

  }
  function saveEditItem(){

    const cleanUrl=normalizeUrl(editingItem.url);
    const info=contentUrlInfo(cleanUrl);
    const finalTopic=editingItem.topic.trim()||inferContentTopic(`${cleanUrl} ${editingItem.title} ${editingItem.note}`,info);
    const finalType=editingItem.type||info.type;
    const manualTags=editingItem.tags.split(',').map(t=>String(t||'').trim()).filter(Boolean);
    patchItem(editingItem.id,{
      title:editingItem.title.trim(),
      url:cleanUrl,
      topic:finalTopic,
      note:editingItem.note.trim(),
      type:finalType,
      status:editingItem.status||'pendiente',
      platform:info.platform,
      format:info.format,

  const FilterRow=<div style={{display:'flex',gap:8,overflowX:'auto',paddingBottom:2,width:'100%',maxWidth:'100%',minWidth:0}} className="scroll">

      ...topics.map(t=>({id:`tema:${t}`,label:t,count:items.filter(x=>x.topic===t).length,color:'var(--sys-indigo)'})),
    ].map(f=><button key={f.id} onClick={()=>setFilter(f.id)}

        borderRadius:999,background:filter===f.id?f.color:'var(--fill-1)',

  </div>;

  const AddCard=adding?<Card radius={18} padding={14}>

      <input value={url} onChange={e=>setUrl(e.target.value)}

          borderRadius:10,padding:'11px 12px'}}/>
      <button onClick={()=>{resetForm();setAdding(false);}} style={{padding:'8px 12px',borderRadius:10,
        background:'var(--fill-1)',fontSize:13,color:'var(--text-3)',fontWeight:600}}>Cancelar</button>
      <button onClick={addContent} disabled={!cleanDraftUrl} style={{padding:'8px 13px',borderRadius:10,
        background:cleanDraftUrl?'var(--accent)':'var(--fill-2)',color:cleanDraftUrl?'var(--accent-ink)':'var(--text-3)',
        fontSize:13,fontWeight:600,cursor:cleanDraftUrl?'pointer':'default'}}>Guardar</button>
    </div>
    {cleanDraftUrl&&<div style={{display:'flex',alignItems:'flex-start',gap:10,padding:'12px 12px',
      borderRadius:14,background:'var(--fill-1)',border:'0.5px solid var(--hairline)'}}>
      <div style={{width:36,height:36,borderRadius:10,background:'var(--accent-soft)',color:'var(--accent)',
        display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
        <IContent size={18}/>
      </div>
      <div style={{flex:1,minWidth:0}}>
        <div style={{display:'flex',alignItems:'center',gap:6,flexWrap:'wrap',marginBottom:5}}>

          {metaLoading&&<span style={{fontSize:11,color:'var(--text-3)'}}>Leyendo metadatos…</span>}
        </div>
        <div style={{fontSize:14,fontWeight:700,color:'var(--text-1)',letterSpacing:-0.2,lineHeight:1.3}}>
          {title||readableTitleFromUrl(cleanDraftUrl,draftInfo)}
        </div>
        <div style={{fontSize:12,color:'var(--text-3)',lineHeight:1.4,marginTop:3}}>
          {note||fallbackContentDescription(cleanDraftUrl,draftInfo)}
        </div>
        {metaError&&<div style={{fontSize:11,color:'var(--text-3)',marginTop:6}}>{metaError}</div>}
      </div>
    </div>}
  </Card>:<button onClick={()=>setAdding(true)}
    style={{display:'flex',alignItems:'center',gap:10,padding:'12px 16px',borderRadius:16,
      background:'var(--fill-1)',border:'0.5px solid var(--hairline)',width:'100%',textAlign:'left'}}>
    <span style={{color:'var(--accent)'}}><IContent size={18}/></span>
    <span style={{flex:1,fontSize:14,color:'var(--text-3)',letterSpacing:-0.1}}>Guardar video, artículo o enlace…</span>
    <span style={{color:'var(--text-3)'}}><IPlus size={16}/></span>
  </button>;

  const ItemList=<Card padding={0} radius={20}>
    {shown.length===0&&<div style={{padding:'28px',textAlign:'center',fontSize:13,color:'var(--text-3)',fontStyle:'italic'}}>
      No hay contenido en esta vista.
    </div>}
    {shown.map((item,i)=>{
      const typeMeta=CONTENT_TYPES.find(t=>t.id===item.type)||CONTENT_TYPES[4];
      const statusMeta=CONTENT_STATUS.find(s=>s.id===item.status)||CONTENT_STATUS[0];
      if(editingItem?.id===item.id)return<div key={item.id} style={{padding:isD?'16px 18px':'14px',borderTop:i>0?'0.5px solid var(--separator)':'none',

        <div style={{display:'grid',gridTemplateColumns:isD?'1fr 180px 140px':'1fr',gap:10,marginBottom:10}}>

            placeholder="Título"

              border:'0.5px solid var(--hairline)',borderRadius:10,padding:'9px 11px',fontFamily:'inherit'}}/>
          <select value={editingItem.type} onChange={e=>setEditingItem(v=>({...v,type:e.target.value}))}
            style={{width:'100%',fontSize:13,color:'var(--text-1)',background:'var(--surface-1)',
              border:'0.5px solid var(--hairline)',borderRadius:10,padding:'9px 10px',fontFamily:'inherit'}}>
            {CONTENT_TYPES.map(t=><option key={t.id} value={t.id}>{t.label}</option>)}
          </select>
          <select value={editingItem.status} onChange={e=>setEditingItem(v=>({...v,status:e.target.value}))}
            style={{width:'100%',fontSize:13,color:'var(--text-1)',background:'var(--surface-1)',
              border:'0.5px solid var(--hairline)',borderRadius:10,padding:'9px 10px',fontFamily:'inherit'}}>
            {CONTENT_STATUS.map(s=><option key={s.id} value={s.id}>{s.label}</option>)}
          </select>
        </div>
        <div style={{display:'grid',gridTemplateColumns:isD?'1fr 180px':'1fr',gap:10,marginBottom:10}}>
          <input value={editingItem.url} onChange={e=>setEditingItem(v=>({...v,url:e.target.value}))}
            placeholder="URL"
            style={{width:'100%',fontSize:13,color:'var(--text-1)',background:'var(--surface-1)',
              border:'0.5px solid var(--hairline)',borderRadius:10,padding:'9px 11px',fontFamily:'inherit'}}/>
          <input value={editingItem.topic} onChange={e=>setEditingItem(v=>({...v,topic:e.target.value}))}
            placeholder="Tema"
            style={{width:'100%',fontSize:13,color:'var(--text-1)',background:'var(--surface-1)',
              border:'0.5px solid var(--hairline)',borderRadius:10,padding:'9px 11px',fontFamily:'inherit'}}/>
        </div>
        <textarea value={editingItem.note} onChange={e=>setEditingItem(v=>({...v,note:e.target.value}))}
