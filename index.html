function HoyAhora({tasks,setTasks,habits,setHabits,rutina,setRutina,calEvents,readOnly=false,softMode=true}){
  const isD=useD();
  const px=isD?52:14;
  const[skipTick,setSkipTick]=useState(0);
	  const focus=useFocusSession();
	  const actions=useMemo(()=>getTodayActions(tasks,habits,rutina,TODAY_KEY),[tasks,habits,rutina,skipTick]);
	  const active=actions[0]||null;
	  const[focusMinutes,setFocusMinutes]=useState(()=>active?getActionDuration(active):25);
	  const nextActions=actions.slice(1,4);
	  const timeline=useMemo(()=>dailyTimeline(calEvents,tasks,rutina,TODAY_KEY),[calEvents,tasks,rutina]);
  const routineItems=Array.isArray(rutina)?rutina:[];
  const routineActions=useMemo(()=>sortActionsWithSkipped(
    routineItems.filter(r=>!r.done).map(r=>makeAction('routine',r,{kindLabel:'Rutina'})),
    TODAY_KEY,
  ),[rutina,skipTick]);
  const routineStepAction=routineActions[0]||null;
  const routineStep=routineStepAction?.item||null;
  const routineIndex=routineStep?routineItems.findIndex(r=>String(r.id)===String(routineStep.id)):-1;
	  const session=focus.session;
	  const sessionAction=session?actions.find(a=>a.key===session.id):active;
	  const durationSeconds=(session?.durationMinutes||active?.durationMinutes||25)*60;
	  const remaining=session?session.remainingSeconds:durationSeconds;
	  const progress=session?Math.max(0,Math.min(1,1-(remaining/durationSeconds))):0;
	  const showFocus=!!session&&session.status!=='done';

	  useEffect(()=>{
	    if(active)setFocusMinutes(getActionDuration(active));
	  },[active?.key]);

  function actionLabel(action){
    if(!action)return'';
    if(action.type==='habit')return'Hábito';
    if(action.type==='routine')return'Rutina';
    if(action.type==='event')return'Evento';
    return'Tarea';
  }
	  function startFocus(action){
	    if(!action)return;
	    const minutes=Math.max(1,Math.min(180,parseInt(focusMinutes,10)||getActionDuration(action)||25));
	    focus.start(action,minutes);
	  }
	  function completeAction(action){
	    if(!action||readOnly)return;
	    if(action.type==='task'){
	      setTasks(prev=>{
	        const result=toggleTaskInBuckets(prev,action.lane,action.id,true,false);
	        if(result.done)recordTaskCompletion(action.id,result.completedAt);
	        return result.tasks;
	      });
	    }else if(action.type==='habit'){
	      setHabits(prev=>(prev||[]).map(h=>String(h.id)===String(action.id)?{...h,done:true}:h));
	    }else if(action.type==='routine'){
	      setRutina(prev=>(prev||[]).map(r=>String(r.id)===String(action.id)?{...r,done:true}:r));
	    }
	    if(focus.session&&String(focus.session.id)===String(action.key))focus.finish();
	  }
  function skipAction(action){
    if(!action)return;
    const ids=skippedToday(TODAY_KEY);
    saveSkippedToday([...ids,action.key],TODAY_KEY);
    setSkipTick(v=>v+1);
  }
  function clearSkipped(){
    saveSkippedToday([],TODAY_KEY);
    setSkipTick(v=>v+1);
  }
  const btn=(label,onClick,{primary=false,disabled=false}={})=><button onClick={onClick} disabled={disabled||readOnly}
    style={{padding:isD?'9px 14px':'8px 12px',borderRadius:12,background:primary?'var(--accent)':'var(--fill-1)',
      color:primary?'var(--accent-ink)':'var(--text-2)',fontSize:13,fontWeight:700,
      opacity:disabled||readOnly?0.5:1,cursor:disabled||readOnly?'default':'pointer',whiteSpace:'nowrap'}}>
    {label}
  </button>;
  const metaPill=(children)=><span style={{fontSize:12,fontWeight:700,color:'var(--text-3)',background:'var(--fill-1)',
    padding:'5px 9px',borderRadius:999}}>{children}</span>;

  return<div style={{padding:`0 ${px}px 24px`,display:'flex',flexDirection:'column',gap:isD?16:12,maxWidth:900,margin:'0 auto',width:'100%'}}>
    <div style={{padding:'0 2px'}}>
      <div style={{fontSize:13,fontWeight:700,color:'var(--accent)',letterSpacing:0.8,textTransform:'uppercase'}}>Hoy, {fmtToday(TODAY)}</div>
      <div style={{fontFamily:'ui-rounded,-apple-system,system-ui',fontSize:isD?34:26,fontWeight:750,color:'var(--text-1)',letterSpacing:-0.7,marginTop:4}}>
        ¿Qué toca ahora?
      </div>
    </div>

    <Card radius={24} padding={isD?24:18} style={{background:'linear-gradient(180deg,var(--surface-1),var(--surface-ink))'}}>
      <div style={{display:'flex',justifyContent:'space-between',gap:14,alignItems:'flex-start',flexWrap:'wrap'}}>
        <div style={{minWidth:0,flex:1}}>
          <div style={{fontSize:12,fontWeight:800,color:'var(--text-3)',letterSpacing:1,textTransform:'uppercase',marginBottom:10}}>Ahora</div>
          {active?<>
            <div style={{fontSize:isD?30:23,fontWeight:800,color:'var(--text-1)',letterSpacing:-0.5,lineHeight:1.15}}>
              {active.item?.emoji&&<span style={{marginRight:8}}>{active.item.emoji}</span>}{active.title}
            </div>
	            <div style={{display:'flex',gap:7,flexWrap:'wrap',marginTop:12}}>
	              {metaPill(actionLabel(active))}
	              {active.startTime&&metaPill(active.startTime)}
	            </div>
          </>:<>
            <div style={{fontSize:isD?25:20,fontWeight:750,color:'var(--text-1)',letterSpacing:-0.3}}>Elige una acción pequeña para empezar.</div>
            <div style={{fontSize:14,color:'var(--text-3)',lineHeight:1.5,marginTop:8}}>Puedes empezar suave y ajustar el plan después.</div>
          </>}
	        </div>
	        <div style={{display:'flex',gap:8,flexWrap:'wrap',justifyContent:isD?'flex-end':'flex-start'}}>
	          {active?<>
	            <label style={{height:isD?36:34,padding:'0 10px',borderRadius:12,background:'var(--fill-1)',
	              display:'flex',alignItems:'center',gap:6,color:'var(--text-2)',fontSize:13,fontWeight:700}}>
	              <input type="number" min="1" max="180" value={focusMinutes}
	                onChange={e=>setFocusMinutes(e.target.value)}
	                onBlur={()=>setFocusMinutes(v=>Math.max(1,Math.min(180,parseInt(v,10)||getActionDuration(active)||25)))}
	                style={{width:42,border:'none',outline:'none',background:'transparent',color:'var(--text-1)',
	                  fontSize:13,fontWeight:800,fontFamily:'inherit',textAlign:'right',padding:0}}/>
	              min
	            </label>
	            {btn('Iniciar focus',()=>startFocus(active),{primary:true})}
	            {btn('Completar',()=>completeAction(active))}
	            {btn(softMode?'Seguir luego':'Saltar',()=>skipAction(active))}
	          </>:btn('Sugerir siguiente acción',clearSkipped,{primary:true})}
	        </div>
	      </div>
	    </Card>
	
	    {showFocus&&<Card radius={22} padding={isD?18:14}>
	      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',gap:12,marginBottom:12}}>
	        <div>
	          <div style={{fontSize:15,fontWeight:800,color:'var(--text-1)'}}>Focus</div>
	          <div style={{fontSize:12,color:'var(--text-3)',marginTop:2}}>{session?.title||active?.title||'Prepara un bloque corto'}</div>
	        </div>
	      </div>
	      <div style={{fontFamily:'ui-rounded,-apple-system,system-ui',fontSize:isD?48:38,fontWeight:800,color:'var(--text-1)',letterSpacing:-1.2,lineHeight:1}}>
	        {formatFocusTime(remaining)}
      </div>
      <div style={{height:8,borderRadius:999,background:'var(--fill-1)',overflow:'hidden',margin:'14px 0'}}>
        <div style={{height:'100%',width:`${progress*100}%`,background:'var(--accent)',borderRadius:999,transition:'width 0.2s'}}/>
      </div>
      <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
        {!session&&btn('Iniciar',()=>active&&focus.start(active),{primary:true,disabled:!active})}
        {session?.status==='idle'&&btn('Iniciar',focus.resume,{primary:true})}
        {session?.status==='running'&&btn('Pausar',focus.pause)}
        {session?.status==='paused'&&btn('Iniciar',focus.resume,{primary:true})}
        {session&&btn('Reiniciar',focus.reset)}
        {session&&btn('+5 min',()=>focus.addMinutes(5))}
        {session&&btn('Terminar',focus.finish)}
	      </div>
	    </Card>}

    <Card radius={22} padding={0}>
      <div style={{padding:'15px 16px 8px',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
        <div style={{fontSize:16,fontWeight:800,color:'var(--text-1)'}}>Siguiente</div>
        <span style={{fontSize:12,color:'var(--text-3)'}}>{nextActions.length} acciones</span>
      </div>
      {nextActions.length===0&&<div style={{padding:'18px 16px 22px',fontSize:14,color:'var(--text-3)',fontStyle:'italic'}}>
        {active?'Después de esto, revisamos otra acción.':'No hay acciones pendientes por ahora.'}
      </div>}
      {nextActions.map((a,i)=><div key={a.key} style={{display:'flex',alignItems:'center',gap:12,padding:'12px 16px',
        borderTop:i>0?'0.5px solid var(--separator)':'none'}}>
        <div style={{width:26,height:26,borderRadius:13,background:'var(--fill-1)',display:'flex',alignItems:'center',justifyContent:'center',
          color:'var(--accent)',fontSize:12,fontWeight:800}}>{i+1}</div>
        <div style={{flex:1,minWidth:0}}>
          <div style={{fontSize:14,fontWeight:700,color:'var(--text-1)',letterSpacing:-0.15,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{a.title}</div>
          <div style={{fontSize:12,color:'var(--text-3)',marginTop:2}}>{actionLabel(a)} · {getActionDuration(a)} min</div>
        </div>
        {btn('Empezar',()=>focus.start(a))}
      </div>)}
    </Card>

    <div style={{display:isD?'grid':'flex',gridTemplateColumns:'1fr 1fr',flexDirection:'column',gap:isD?16:12}}>
      <Card radius={22} padding={0}>
        <div style={{padding:'15px 16px 8px',fontSize:16,fontWeight:800,color:'var(--text-1)'}}>Plan del día</div>
        {timeline.length===0&&<div style={{padding:'18px 16px 22px',fontSize:14,color:'var(--text-3)',fontStyle:'italic'}}>Aún no hay bloques con hora.</div>}
        {timeline.slice(0,8).map((b,i)=><div key={b.key} style={{display:'grid',gridTemplateColumns:'54px 1fr',gap:10,padding:'10px 16px',
          borderTop:i>0?'0.5px solid var(--separator)':'none',alignItems:'baseline'}}>
          <div style={{fontSize:13,fontWeight:800,color:'var(--accent)'}}>{b.time}</div>
          <div>
            <div style={{fontSize:14,fontWeight:700,color:'var(--text-1)'}}>{b.title}</div>
            <div style={{fontSize:11.5,color:'var(--text-3)',marginTop:1}}>{b.type}</div>
          </div>
        </div>)}
      </Card>

      <Card radius={22} padding={18}>
        <div style={{fontSize:16,fontWeight:800,color:'var(--text-1)',marginBottom:12}}>Rutina guiada</div>
        {routineStep?<>
          <div style={{fontSize:12,fontWeight:800,color:'var(--accent)',letterSpacing:0.6,textTransform:'uppercase',marginBottom:8}}>
            Paso {routineIndex+1}/{routineItems.length}
          </div>
          <div style={{fontSize:isD?22:19,fontWeight:800,color:'var(--text-1)',letterSpacing:-0.3,lineHeight:1.25}}>
            {routineStep.text}
          </div>
          {routineStep.time&&<div style={{fontSize:13,color:'var(--text-3)',marginTop:6}}>{routineStep.time}</div>}
          <div style={{display:'flex',gap:8,marginTop:16,flexWrap:'wrap'}}>
            {btn('Hecho',()=>completeAction(routineStepAction),{primary:true})}
            {btn(softMode?'Seguir luego':'Saltar',()=>skipAction(routineStepAction))}
          </div>
        </>:<div style={{fontSize:14,color:'var(--text-3)',fontStyle:'italic'}}>Rutina completada</div>}
      </Card>
    </div>
  </div>;
}

function HoyDashboard({score,habits,setHabits,tasks,setTasks,mental,streak,readOnly=false}){
  const isD=useD();
  const doneH=habits.filter(h=>h.done).length;
  const mentalGood=mental.filter(m=>m.state==='bien').length;
  const mentalMarked=mental.filter(m=>m.state==='bien'||m.state==='mal').length;
	  const mentalScore=mentalMarked>0?+(mentalGood/mentalMarked*10).toFixed(1):0;
	  const top3Done=tasks.top3.filter(t=>t.done).length;
	  const px=isD?52:14;
	  const streakCount=parseInt(streak,10)||0;
	  const recent=useMemo(()=>recentScoreContext(TODAY_KEY,5),[score]);
	  const hasRealStreak=streakCount>=2&&score>=6;
	  function dashboardNudge(){
	    const current=score==null?null:Number(score);
	    const recentLine=recent.days.length
	      ?`Últimos ${recent.days.length} días evaluables: ${recent.weak} flojo${recent.weak===1?'':'s'} por debajo de 6.`
	      :'Aún no hay historial suficiente para comparar.';
	    if(current===null)return{
	      title:'Sin score todavía',
	      body:'Marca hábitos para que esto deje de ser decoración y empiece a decirte la verdad.',
	      tone:'var(--accent)',
	      soft:'var(--accent-soft)',
	    };
	    if(hasRealStreak)return{
	      title:'Ahora sí: estás en racha',
	      body:`${streakCount} días seguidos con score ≥ 6. No lo sueltes por una tarde tonta.`,
	      tone:'var(--sys-green)',
	      soft:'var(--sys-green-soft)',
	    };
	    if(current>=8)return{
	      title:'Buen día, falta continuidad',
	      body:recent.priorGoodRun>0
	        ?`Vas en ${current.toFixed(1)}/10. Repite esto mañana y ya empieza a oler a racha.`
	        :`Vas en ${current.toFixed(1)}/10, pero vienes sin base sólida. Mañana decide si esto fue impulso o sistema.`,
	      tone:'var(--sys-green)',
	      soft:'var(--sys-green-soft)',
	    };
	    if(current>=6)return{
	      title:'Cumples, pero no es racha',
	      body:`Vas en ${current.toFixed(1)}/10. Bien, pero una racha empieza cuando lo repites, no cuando sale una vez.`,
	      tone:'var(--sys-amber)',
	      soft:'var(--sys-amber-soft)',
	    };
	    if(current<4)return{
	      title:'Día de mierda, espabila',
	      body:`Vas en ${current.toFixed(1)}/10. ${recentLine} Haz un hábito ahora y salva algo antes de cerrar el día.`,
	      tone:'var(--sys-red)',
	      soft:'var(--sys-red-soft)',
	    };
	    return{
	      title:'Día flojo, toca reaccionar',
	      body:`Vas en ${current.toFixed(1)}/10. ${recentLine} No negocies con todo: completa una cosa pequeña ya.`,
	      tone:'var(--sys-red)',
	      soft:'var(--sys-red-soft)',
	    };
	  }
	  const nudge=dashboardNudge();

  const ScoreCard=<Card padding={0} radius={20} style={{overflow:'hidden'}}>
    <div style={{position:'relative',padding:isD?'22px 22px 18px':'14px 16px 12px',
      background:`linear-gradient(135deg,${scoreHueSoft(score)} 0%,transparent 70%)`}}>
      <div style={{fontSize:isD?12:10.5,fontWeight:600,letterSpacing:isD?1:0.9,textTransform:'uppercase',
        color:'var(--text-3)',marginBottom:isD?10:6}}>Score del día</div>
      <div style={{display:'flex',alignItems:'flex-end',gap:isD?16:12}}>
        <div style={{fontFamily:'ui-rounded,-apple-system,system-ui',
          fontSize:isD?96:48,fontWeight:700,letterSpacing:isD?-3:-1.6,color:scoreHue(score),lineHeight:0.92}}>
          {score!=null?score.toFixed(1):'—'}
        </div>
        <div style={{paddingBottom:isD?10:6,flex:1}}>
          <div style={{fontSize:isD?13:11.5,color:'var(--text-3)',marginBottom:isD?6:4}}>de 10</div>
          <LinearProgress value={score!=null?score:0} max={10} color={scoreHue(score)} thickness={isD?5:4}/>
        </div>
      </div>
      <div style={{display:'flex',gap:6,marginTop:isD?14:10,flexWrap:'wrap'}}>
        <Chip tint="var(--sys-orange)"><span style={{display:'inline-flex',alignItems:'center',gap:4}}><IFire size={11} sw={1.8}/>{streak} días</span></Chip>
        <Chip tint="var(--accent)">Hábitos {doneH}/{habits.length}</Chip>
        <Chip tint="var(--sys-purple)">Mental {mentalMarked>0?`${mentalScore}/10`:'—'}</Chip>
      </div>
    </div>
  </Card>;

  const RingsCard=<Card padding={isD?18:14} radius={20}>
    <div style={{display:'flex',alignItems:'center',justifyContent:'space-around',gap:6}}>
      {[
        {label:'Hábitos',value:doneH,max:habits.length,unit:`${doneH}/${habits.length}`,color:'var(--sys-green)'},
        {label:'Mental',value:mentalGood,max:mentalMarked||mental.length,unit:mentalMarked>0?`${mentalScore.toFixed(0)}%`:'—',color:'var(--accent)'},
        {label:'Top 3',value:top3Done,max:3,unit:`${top3Done}/3`,color:'var(--sys-purple)'},
      ].map(r=><div key={r.label} style={{display:'flex',flexDirection:'column',alignItems:'center',gap:6}}>
        <Ring value={r.value} max={r.max} size={isD?100:60} stroke={isD?10:7} color={r.color}>
          <span style={{fontFamily:'ui-rounded,-apple-system,system-ui',fontSize:isD?20:13,fontWeight:700,
            color:r.color,letterSpacing:-0.4}}>{r.unit}</span>
        </Ring>
        <span style={{fontSize:10.5,color:'var(--text-3)',fontWeight:500,letterSpacing:0.1,textTransform:'uppercase'}}>{r.label}</span>
      </div>)}
    </div>
  </Card>;

  const Top3Card=<Card padding={0} radius={20}>
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:isD?'16px 18px 10px':'12px 14px 8px'}}>
      <div style={{fontSize:isD?18:14.5,fontWeight:600,color:'var(--text-1)',letterSpacing:-0.3}}>{readOnly?'Top 3 del día':'Top 3 de hoy'}</div>
      <Chip tint="var(--accent)">{top3Done}/3</Chip>
    </div>
    <div style={{padding:isD?'0 20px 14px':'0 14px 10px'}}>
      {tasks.top3.length===0&&<div style={{fontSize:isD?15:13,color:'var(--text-3)',textAlign:'center',padding:'14px 0',fontStyle:'italic'}}>Sin tareas top 3</div>}
      {tasks.top3.map((t,i)=>{
        const subs=t.subtasks||[];
        const subsDone=subs.filter(s=>s.done).length;
        return<div key={t.id}
          style={{padding:isD?'13px 0':'8px 0',borderTop:i>0?'0.5px solid var(--separator)':'none'}}>
          <div onClick={readOnly?undefined:()=>setTasks(prev=>{
              const result=toggleTaskInBuckets(prev,'top3',t.id,!t.done,t.done);
              if(result.done)recordTaskCompletion(t.id,result.completedAt);
              else clearTaskCompletion(t.id);
              return result.tasks;
            })}
            style={{display:'flex',alignItems:'center',gap:12,cursor:readOnly?'default':'pointer'}}>
            {readOnly
              ?<div style={{width:4,height:isD?26:22,borderRadius:3,flexShrink:0,
                background:t.done?'var(--sys-green)':'var(--separator-strong)',opacity:t.done?1:0.75}}/>
              :<div style={{width:isD?24:22,height:isD?24:22,borderRadius:12,flexShrink:0,
                border:t.done?'none':'1.5px solid var(--separator-strong)',
                background:t.done?'var(--sys-green)':'transparent',
                display:'flex',alignItems:'center',justifyContent:'center',color:'#fff'}}>
                {t.done&&<ICheck size={isD?14:13}/>}
              </div>}
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontSize:isD?16:15,color:t.done?'var(--text-3)':'var(--text-1)',
                textDecoration:t.done?'line-through':'none',letterSpacing:-0.2}}>
                {t.text}
              </div>
              <div style={{marginTop:4,fontSize:isD?11.5:10.5,color:'var(--text-3)',fontWeight:600}}>
                {t.durationMinutes||defaultTaskDuration('top3')} min{t.startTime?` · ${t.startTime}`:''}
              </div>
              {subs.length>0&&<div style={{marginTop:4,fontSize:isD?11.5:10.5,color:'var(--text-3)'}}>
                {subsDone}/{subs.length} subtareas
              </div>}
            </div>
            <div style={{fontSize:isD?12:11,fontWeight:700,color:'var(--accent)',background:'var(--accent-soft)',
              padding:'2px 7px',borderRadius:999}}>#{i+1}</div>
          </div>
          {subs.length>0&&<div style={{paddingLeft:isD?36:34,paddingTop:8,display:'flex',flexDirection:'column',gap:6}}>
            {subs.map(s=><button key={s.id} type="button" onClick={readOnly?undefined:e=>{
                e.stopPropagation();
                setTasks(prev=>({...prev,top3:prev.top3.map(x=>x.id===t.id?touchTask({...x,subtasks:(x.subtasks||[]).map(y=>y.id===s.id?{...y,done:!y.done}:y)},'top3'):x)}));
              }}
              title={readOnly?(s.done?'Completada':'Pendiente'):(s.done?'Marcar subtarea como pendiente':'Marcar subtarea como completada')}
              aria-label={readOnly?(s.done?'Subtarea completada':'Subtarea pendiente'):(s.done?'Marcar subtarea como pendiente':'Marcar subtarea como completada')}
              style={{display:'flex',alignItems:'center',gap:8,cursor:readOnly?'default':'pointer',width:'100%',
                padding:'3px 0',border:'none',background:'transparent',textAlign:'left',fontFamily:'inherit'}}>
              {readOnly
                ?<div style={{width:4,height:isD?17:15,borderRadius:3,flexShrink:0,
                  background:s.done?'var(--sys-purple)':'var(--separator-strong)',opacity:s.done?1:0.72}}/>
                :<div style={{width:isD?16:15,height:isD?16:15,borderRadius:999,flexShrink:0,
                  border:s.done?'none':'1.5px solid var(--separator-strong)',
                  background:s.done?'var(--sys-purple)':'transparent',
                  display:'flex',alignItems:'center',justifyContent:'center',color:'#fff'}}>
                  {s.done&&<ICheck size={isD?9:8}/>}
                </div>}
              <div style={{fontSize:isD?13.5:12.5,color:s.done?'var(--text-3)':'var(--text-2)',
                textDecoration:s.done?'line-through':'none',letterSpacing:-0.1}}>
                {s.text}
              </div>
            </button>)}
          </div>}
        </div>;
      })}
    </div>
  </Card>;

  const HabitsCard=<Card padding={0} radius={20}>
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:isD?'16px 18px 10px':'12px 14px 8px'}}>
      <div style={{display:'flex',alignItems:'center',gap:8}}>
        <span style={{color:'var(--sys-green)'}}><IHabits size={16}/></span>
        <div style={{fontSize:isD?16:14.5,fontWeight:600,color:'var(--text-1)',letterSpacing:-0.2}}>Hábitos</div>
      </div>
      <div style={{fontSize:13,color:'var(--text-3)'}}>{doneH}/{habits.length}</div>
    </div>
    <div style={{padding:isD?'0 18px 10px':'0 14px 8px'}}>
      <LinearProgress value={doneH} max={habits.length} color="var(--sys-green)" thickness={4}/>
    </div>
    <div style={{padding:isD?'0 8px 14px':'2px 6px 10px'}}>
      {habits.map((h,i)=><div key={h.id} onClick={readOnly?undefined:()=>setHabits(prev=>prev.map(x=>x.id===h.id?{...x,done:!x.done}:x))}
        style={{display:'flex',alignItems:'center',gap:11,
        padding:isD?'8px 10px':'6px 8px',borderRadius:10,cursor:readOnly?'default':'pointer',
        transition:'background 0.15s',':hover':{background:'var(--fill-1)'}}}>
        <div style={{width:18,height:18,borderRadius:6,flexShrink:0,
          border:h.done?'none':'1.5px solid var(--separator-strong)',
          background:h.done?'var(--sys-green)':'transparent',
          display:'flex',alignItems:'center',justifyContent:'center',color:'#fff'}}>
          {h.done&&<ICheck size={11}/>}
        </div>
        <div style={{flex:1,fontSize:13.5,color:h.done?'var(--text-3)':'var(--text-1)',
          textDecoration:h.done?'line-through':'none',letterSpacing:-0.15}}>
          {h.name}
        </div>
      </div>)}
    </div>
  </Card>;

	  const InsightBanner=<div style={{padding:'14px 16px',borderRadius:16,
	    background:`linear-gradient(135deg,${nudge.soft},transparent)`,
	    border:`0.5px solid ${nudge.tone}`,display:'flex',gap:12,alignItems:'flex-start'}}>
	    <div style={{flexShrink:0,width:30,height:30,borderRadius:9,background:nudge.tone,color:'var(--accent-ink)',
	      display:'flex',alignItems:'center',justifyContent:'center'}}><ISparkle size={16}/></div>
	    <div>
	      <div style={{fontSize:13,fontWeight:700,color:'var(--text-1)',marginBottom:2}}>{nudge.title}</div>
	      <div style={{fontSize:12,color:'var(--text-2)',lineHeight:1.4}}>
	        {nudge.body}
	      </div>
	    </div>
	  </div>;

  if(isD){
    return<div style={{padding:`0 ${px}px 24px`,display:'grid',gridTemplateColumns:'1.1fr 1fr 1fr',gap:20,alignItems:'start'}}>
      <div style={{display:'flex',flexDirection:'column',gap:18}}>
        {ScoreCard}
        {InsightBanner}
      </div>
      <div style={{display:'flex',flexDirection:'column',gap:18}}>
        {Top3Card}
        {RingsCard}
      </div>
      <div style={{display:'flex',flexDirection:'column',gap:18}}>
        {HabitsCard}
      </div>
    </div>;
  }
  return<div style={{padding:'0 14px',display:'flex',flexDirection:'column',gap:10}}>
    {ScoreCard}{RingsCard}{Top3Card}{HabitsCard}{InsightBanner}
  </div>;
}

function HoyTareas({tasks,setTasks,showCompleted=true,readOnly=false}){
  const isD=useD();
  const[newTask,setNewTask]=useLS('zp_draft_task','');
  const[newLane,setNewLane]=useLS('zp_draft_lane','enfoque');
  const[newDuration,setNewDuration]=useState(defaultTaskDuration(newLane));
  const[newStartTime,setNewStartTime]=useState('');
  const newLaneRef=useRef(newLane);
  useEffect(()=>{newLaneRef.current=newLane;},[newLane]);
  const taskDates=React.useMemo(()=>{try{const s=localStorage.getItem('zp_task_dates');return s?JSON.parse(s):{};}catch{return{};}},[]); // registry safe from Supabase overwrite
  const[editTask,setEditTask]=useState({lane:null,id:null,val:'',durationMinutes:25,startTime:''});
  const[expanded,setExpanded]=useState({});
  const[newSub,setNewSub]=useState({});
  const[draggingTaskId,setDraggingTaskId]=useState(null);
  const taskDragRef=useRef(null);
  const tasksRef=useRef(tasks);
  const taskDragAlertRef=useRef(false);
  const taskDragCleanupRef=useRef(null);
  useEffect(()=>{tasksRef.current=tasks;},[tasks]);
  const LANES=[
    {id:'top3',label:'Top 3',desc:'máx. 3',color:'var(--accent)'},
    {id:'enfoque',label:'En Foco',desc:'',color:'var(--sys-purple)'},
    {id:'parking',label:'Parking',desc:'',color:'var(--text-3)'},
  ];
  const activeTasks=React.useMemo(()=>LANES.reduce((acc,l)=>{
    acc[l.id]=(tasks[l.id]||[]).filter(t=>!t.done);
    return acc;
  },{}),[tasks]);
  const completedTasks=React.useMemo(()=>LANES.flatMap(l=>(tasks[l.id]||[])
    .filter(t=>t.done)
    .map(t=>({...t,__lane:l.id,__laneLabel:l.label,__laneColor:l.color}))),[tasks]);
  function toggleTask(lane,id,currentDone){setTasks(prev=>{
    const result=toggleTaskInBuckets(prev,lane,id,!currentDone,currentDone);
    if(result.done)recordTaskCompletion(id,result.completedAt);
    else clearTaskCompletion(id);
    return result.tasks;
  });}
  function chooseNewLane(lane){newLaneRef.current=lane;setNewLane(lane);setNewDuration(defaultTaskDuration(lane));}
  function addTask(){if(!newTask.trim())return;
    const lane=newLaneRef.current||newLane||'enfoque';
    if(lane==='top3'&&(activeTasks.top3||[]).length>=3){alert('Top 3 solo admite 3 tareas pendientes.');return;}
    const id='t'+Date.now();
    setTasks(prev=>({...prev,[lane]:[...(prev[lane]||[]),makeTask(id,newTask.trim(),TODAY_KEY,lane,{durationMinutes:newDuration,startTime:newStartTime})]}));
    setNewTask('');setNewStartTime('');
  }
  function saveDraggedTasks(next,movedId,toLane){
    tasksRef.current=next;
    setTasks(next);
    if(editTask.id===movedId)setEditTask(ev=>({...ev,lane:toLane}));
  }
  function reorderTaskList(list,from,to){
    const arr=Array.isArray(list)?[...list]:[];
    if(from<0||to<0||from>=arr.length||to>=arr.length||from===to)return arr;
    const[item]=arr.splice(from,1);
    arr.splice(to,0,item);
    return arr;
  }
  function beginTaskDrag(lane,id,e){
    e.preventDefault();
    if(taskDragCleanupRef.current)taskDragCleanupRef.current();
    taskDragRef.current={lane,id};
    taskDragAlertRef.current=false;
    setDraggingTaskId(id);
    const move=ev=>{ev.preventDefault();hoverTaskAtPoint(ev);};
    const up=ev=>endTaskDrag(ev);
    window.addEventListener('pointermove',move,{passive:false});
    window.addEventListener('pointerup',up,{passive:false});
    window.addEventListener('pointercancel',up,{passive:false});
    taskDragCleanupRef.current=()=>{
      window.removeEventListener('pointermove',move);
      window.removeEventListener('pointerup',up);
      window.removeEventListener('pointercancel',up);
      taskDragCleanupRef.current=null;
    };
  }
  function reorderDraggedTask(toLane,targetId=null){
    const drag=taskDragRef.current;
    if(!drag||!toLane)return;
    const lanes=['top3','enfoque','parking'];
    if(!lanes.includes(toLane))return;
    const current=normalizeTaskBuckets(tasksRef.current||DEF_TASKS).tasks;
    const fromLane=drag.lane;
    const sourceList=current[fromLane]||[];
    const task=sourceList.find(t=>t.id===drag.id);
    if(!task||task.done)return;
    if(toLane==='top3'&&fromLane!=='top3'&&(current.top3||[]).filter(t=>!t.done&&t.id!==drag.id).length>=3){
      if(!taskDragAlertRef.current){taskDragAlertRef.current=true;alert('Top 3 solo admite 3 tareas pendientes.');}
      return;
    }
    if(fromLane===toLane){
      const from=sourceList.findIndex(t=>t.id===drag.id);
      const to=targetId?sourceList.findIndex(t=>t.id===targetId):sourceList.length-1;
      if(from<0||to<0||from===to)return;
      const next={...current,[fromLane]:reorderTaskList(sourceList,from,to).map(t=>t.id===drag.id?touchTask(t,toLane):t)};
      saveDraggedTasks(next,drag.id,toLane);
      return;
    }
    const next={...current,[fromLane]:sourceList.filter(t=>t.id!==drag.id)};
    const dest=[...(next[toLane]||[])];
    const insertAt=targetId?dest.findIndex(t=>t.id===targetId):-1;
    dest.splice(insertAt>=0?insertAt:dest.length,0,touchTask(task,toLane));
    next[toLane]=dest;
    taskDragRef.current={lane:toLane,id:drag.id};
    saveDraggedTasks(next,drag.id,toLane);
  }
  function hoverTaskAtPoint(e){
    if(!taskDragRef.current)return;
    const els=document.elementsFromPoint?document.elementsFromPoint(e.clientX,e.clientY):[document.elementFromPoint(e.clientX,e.clientY)];
    const row=(els||[]).map(el=>el&&el.closest?el.closest('[data-task-id]'):null).find(Boolean);
    const laneEl=(els||[]).map(el=>el&&el.closest?el.closest('[data-task-lane]'):null).find(Boolean);
    const targetLane=row?row.getAttribute('data-task-lane'):(laneEl?laneEl.getAttribute('data-task-lane'):null);
    const targetId=row?row.getAttribute('data-task-id'):null;
    reorderDraggedTask(targetLane,targetId);
  }
  function endTaskDrag(e){
    if(e&&e.preventDefault)e.preventDefault();
    if(taskDragCleanupRef.current)taskDragCleanupRef.current();
    taskDragRef.current=null;
    taskDragAlertRef.current=false;
    setDraggingTaskId(null);
  }
  function deleteTask(lane,id){recordTaskDelete(id);setTasks(prev=>({...prev,[lane]:prev[lane].filter(t=>t.id!==id)}));}
  function startEdit(lane,task){setEditTask({lane,id:task.id,val:task.text,durationMinutes:task.durationMinutes||defaultTaskDuration(lane),startTime:task.startTime||''});}
  function commitEdit(){
    if(!editTask.id)return;
    if(editTask.val.trim())
      setTasks(prev=>({...prev,[editTask.lane]:prev[editTask.lane].map(t=>t.id===editTask.id?touchTask({
        ...t,
        text:editTask.val.trim(),
        durationMinutes:parseInt(editTask.durationMinutes,10)||defaultTaskDuration(editTask.lane),
        startTime:editTask.startTime||'',
      },editTask.lane):t)}));
    else
      {recordTaskDelete(editTask.id);setTasks(prev=>({...prev,[editTask.lane]:prev[editTask.lane].filter(t=>t.id!==editTask.id)}));}
    setEditTask({lane:null,id:null,val:'',durationMinutes:25,startTime:''});
  }
  function toggleSub(lane,tid,sid){setTasks(prev=>({...prev,[lane]:prev[lane].map(t=>t.id===tid?touchTask({...t,subtasks:(t.subtasks||[]).map(s=>s.id===sid?{...s,done:!s.done}:s)},lane):t)}));}
  function addSub(lane,tid){const text=(newSub[tid]||'').trim();if(!text)return;
    const id='s'+Date.now();
    setTasks(prev=>({...prev,[lane]:prev[lane].map(t=>t.id===tid?touchTask({...t,subtasks:[...(t.subtasks||[]),{id,text,done:false}]},lane):t)}));
    setNewSub(prev=>({...prev,[tid]:''}));}
  function deleteSub(lane,tid,sid){setTasks(prev=>({...prev,[lane]:prev[lane].map(t=>t.id===tid?touchTask({...t,subtasks:(t.subtasks||[]).filter(s=>s.id!==sid)},lane):t)}));}
  function toggleExpand(id){setExpanded(prev=>({...prev,[id]:!prev[id]}));}
  const px=isD?52:14;

  function renderTask(t,laneId,laneColor){
    const isEditing=editTask.id===t.id&&editTask.lane===laneId;
    const isExp=!!expanded[t.id];
    const subs=t.subtasks||[];
    const subsDone=subs.filter(s=>s.done).length;
    const canDrag=!readOnly&&!t.done&&!isEditing;
    return<div key={t.id} {...(canDrag?{'data-task-id':t.id,'data-task-lane':laneId}:{})}
      style={{borderBottom:'0.5px solid var(--separator)',background:draggingTaskId===t.id?'var(--fill-1)':'transparent',
        opacity:draggingTaskId===t.id?0.62:1}}>
      <div style={{display:'flex',alignItems:'center',gap:10,padding:'10px 10px',borderRadius:isExp?0:10}}>
        {canDrag&&<div title="Arrastrar para ordenar" aria-label="Arrastrar tarea"
          onPointerDown={e=>beginTaskDrag(laneId,t.id,e)}
          style={{width:18,height:24,display:'flex',alignItems:'center',justifyContent:'center',
            color:'var(--text-3)',cursor:'grab',flexShrink:0,touchAction:'none'}}>
          <IGrip size={15}/>
        </div>}
        {readOnly
          ?<div title={t.done?'Completada':'Pendiente'} aria-label={t.done?'Tarea completada':'Tarea pendiente'}
            style={{width:4,height:24,borderRadius:3,flexShrink:0,
              background:t.done?laneColor:'var(--separator-strong)',opacity:t.done?1:0.72}}/>
          :<button onClick={()=>toggleTask(laneId,t.id,t.done)}
          title={t.done?'Marcar como pendiente':'Marcar como completada'}
          aria-label={t.done?'Marcar tarea como pendiente':'Marcar tarea como completada'}
          style={{width:18,height:18,borderRadius:9,flexShrink:0,cursor:'pointer',
            border:t.done?'none':`1.5px solid ${laneColor}`,
            background:t.done?laneColor:'var(--surface-1)',
            boxShadow:t.done?'none':`0 0 0 2px ${laneColor}14`,
            display:'flex',alignItems:'center',justifyContent:'center',color:laneColor==='var(--accent)'?'var(--accent-ink)':'#fff'}}>
          {t.done&&<ICheck size={11}/>}
        </button>}
        {isEditing
          ?<div style={{flex:1,display:'grid',gridTemplateColumns:isD?'1fr 92px 86px':'1fr',gap:6}}>
            <input autoFocus value={editTask.val} onChange={e=>setEditTask(ev=>({...ev,val:e.target.value}))}
              onKeyDown={e=>{if(e.key==='Enter')commitEdit();if(e.key==='Escape')setEditTask({lane:null,id:null,val:'',durationMinutes:25,startTime:''});}}
              style={{width:'100%',fontSize:14,color:'var(--text-1)',background:'var(--fill-1)',border:'none',
                outline:'none',borderRadius:7,padding:'5px 8px',fontFamily:'inherit'}}/>
            <select value={editTask.durationMinutes} onChange={e=>setEditTask(ev=>({...ev,durationMinutes:parseInt(e.target.value,10)}))}
              style={{width:'100%',fontSize:12,color:'var(--text-2)',background:'var(--fill-1)',border:'none',borderRadius:7,padding:'5px 6px',fontFamily:'inherit'}}>
              {TASK_DURATION_OPTIONS.map(n=><option key={n} value={n}>{n} min</option>)}
            </select>
            <input type="time" value={editTask.startTime} onChange={e=>setEditTask(ev=>({...ev,startTime:e.target.value}))}
              style={{width:'100%',fontSize:12,color:'var(--text-2)',background:'var(--fill-1)',border:'none',borderRadius:7,padding:'5px 6px',fontFamily:'inherit'}}/>
          </div>
          :<div onDoubleClick={readOnly?undefined:()=>startEdit(laneId,t)}
            style={{flex:1,fontSize:14,color:t.done?'var(--text-3)':'var(--text-1)',
              textDecoration:t.done?'line-through':'none',letterSpacing:-0.1,lineHeight:1.4}}>
            {t.text}
            <span style={{marginLeft:6,fontSize:11,color:'var(--text-3)',fontWeight:600,whiteSpace:'nowrap'}}>
              {t.durationMinutes||defaultTaskDuration(laneId)} min{t.startTime?` · ${t.startTime}`:''}
            </span>
            {(()=>{const od=t.createdDate&&t.createdDate<TODAY_KEY?t.createdDate:(taskDates[t.id]&&taskDates[t.id]<TODAY_KEY?taskDates[t.id]:null);
              return od&&!t.done?<span style={{marginLeft:6,fontSize:10,fontWeight:700,color:'var(--sys-red)',
                background:'var(--sys-red-soft)',borderRadius:4,padding:'1px 5px',whiteSpace:'nowrap'}}>
                {Math.round((new Date(TODAY_KEY)-new Date(od))/86400000)}d tarde
              </span>:null;})()}
            {subs.length>0&&<span style={{marginLeft:6,fontSize:11,color:'var(--text-3)',fontWeight:500}}>{subsDone}/{subs.length}</span>}
          </div>}
        {isEditing&&<button onClick={commitEdit} style={{padding:'2px 7px',borderRadius:6,
          background:'var(--accent)',color:'var(--accent-ink)',border:'none',cursor:'pointer',fontSize:11,fontWeight:700,lineHeight:1}}>
          OK
        </button>}
        <button onClick={()=>toggleExpand(t.id)} style={{padding:'2px 5px',borderRadius:6,
          background:'var(--fill-1)',border:'none',cursor:'pointer',fontSize:13,color:'var(--text-3)',lineHeight:1}}>
          {isExp?'▾':'▸'}
        </button>
        {!readOnly&&<button onClick={()=>deleteTask(laneId,t.id)} style={{width:20,height:20,borderRadius:10,flexShrink:0,
          background:'var(--fill-1)',color:'var(--text-3)',display:'flex',alignItems:'center',
          justifyContent:'center',fontSize:13,cursor:'pointer',border:'none'}}>×</button>}
      </div>
      {isExp&&<div style={{paddingLeft:40,paddingRight:10,paddingBottom:8,background:'var(--fill-1)',borderRadius:'0 0 10px 10px'}}>
        {subs.map(s=><div key={s.id} style={{display:'flex',alignItems:'center',gap:8,padding:'6px 0'}}>
          {readOnly
            ?<div title={s.done?'Completada':'Pendiente'} aria-label={s.done?'Subtarea completada':'Subtarea pendiente'}
              style={{width:4,height:18,borderRadius:3,flexShrink:0,
                background:s.done?laneColor:'var(--separator-strong)',opacity:s.done?1:0.72}}/>
            :<button type="button" onClick={()=>toggleSub(laneId,t.id,s.id)}
            title={s.done?'Marcar subtarea como pendiente':'Marcar subtarea como completada'}
            aria-label={s.done?'Marcar subtarea como pendiente':'Marcar subtarea como completada'}
            style={{width:18,height:18,borderRadius:9,flexShrink:0,cursor:'pointer',
            border:s.done?'none':`1.5px solid ${laneColor}55`,background:s.done?laneColor:'transparent',
            display:'flex',alignItems:'center',justifyContent:'center',color:laneColor==='var(--accent)'?'var(--accent-ink)':'#fff',padding:0}}>
            {s.done&&<ICheck size={9}/>}
          </button>}
          <button type="button" onClick={readOnly?undefined:()=>toggleSub(laneId,t.id,s.id)}
            title={s.done?'Marcar subtarea como pendiente':'Marcar subtarea como completada'}
            style={{flex:1,minWidth:0,fontSize:13,color:s.done?'var(--text-3)':'var(--text-1)',
              textDecoration:s.done?'line-through':'none',background:'transparent',border:'none',
              textAlign:'left',cursor:readOnly?'default':'pointer',padding:'2px 0',fontFamily:'inherit'}}>{s.text}</button>
          {!readOnly&&<button onClick={()=>deleteSub(laneId,t.id,s.id)} style={{width:18,height:18,borderRadius:9,
            background:'rgba(0,0,0,0.06)',color:'var(--text-3)',display:'flex',alignItems:'center',
            justifyContent:'center',fontSize:11,cursor:'pointer',border:'none'}}>×</button>}
        </div>)}
        {!readOnly&&<div style={{display:'flex',gap:6,paddingTop:4,alignItems:'center'}}>
          <input value={newSub[t.id]||''} onChange={e=>setNewSub(prev=>({...prev,[t.id]:e.target.value}))}
            onKeyDown={e=>{if(e.key==='Enter')addSub(laneId,t.id);}}
            placeholder="Añadir subtarea…"
            style={{flex:1,fontSize:12,color:'var(--text-1)',background:'transparent',border:'none',outline:'none'}}/>
          <button onClick={()=>addSub(laneId,t.id)} style={{padding:'3px 8px',borderRadius:6,fontSize:11,
            fontWeight:600,background:'var(--fill-2)',color:'var(--text-3)',border:'none',cursor:'pointer'}}>+</button>
        </div>}
      </div>}
    </div>;
  }

  const AddCard=<Card radius={16} padding={0}>
    <div style={{display:'flex',alignItems:'center',gap:10,padding:'10px 14px',borderBottom:'0.5px solid var(--separator)'}}>
      <IPlus size={16} style={{color:'var(--accent)',flexShrink:0}}/>
      <input value={newTask} onChange={e=>setNewTask(e.target.value)}
        onKeyDown={e=>e.key==='Enter'&&addTask()} placeholder="Nueva tarea…"
        style={{flex:1,fontSize:14,color:'var(--text-1)',background:'transparent',border:'none',outline:'none'}}/>
      <button onClick={addTask} style={{padding:'5px 12px',borderRadius:8,background:'var(--accent)',
        color:'var(--accent-ink)',fontSize:12,fontWeight:600,border:'none',cursor:'pointer'}}>Añadir</button>
    </div>
    <div style={{display:'flex',gap:2,padding:'8px 10px 6px'}}>
      {LANES.map(l=><button key={l.id} onClick={()=>chooseNewLane(l.id)} style={{flex:1,padding:'5px 8px',
        borderRadius:8,fontSize:12,border:'none',cursor:'pointer',
        background:newLane===l.id?'var(--accent)':'var(--fill-1)',
        color:newLane===l.id?'var(--accent-ink)':'var(--text-3)',fontWeight:newLane===l.id?600:500}}>{l.label}</button>)}
    </div>
    <div style={{display:'grid',gridTemplateColumns:isD?'120px 120px 1fr':'1fr 1fr',gap:8,padding:'0 10px 10px'}}>
      <select aria-label="Duración estimada" value={newDuration} onChange={e=>setNewDuration(parseInt(e.target.value,10))}
        style={{width:'100%',fontSize:12,color:'var(--text-2)',background:'var(--fill-1)',
          border:'none',borderRadius:8,padding:'7px 8px',fontFamily:'inherit'}}>
        {TASK_DURATION_OPTIONS.map(n=><option key={n} value={n}>{n} min</option>)}
      </select>
      <input aria-label="Hora opcional" type="time" value={newStartTime} onChange={e=>setNewStartTime(e.target.value)}
        style={{width:'100%',fontSize:12,color:'var(--text-2)',background:'var(--fill-1)',
          border:'none',borderRadius:8,padding:'7px 8px',fontFamily:'inherit'}}/>
    </div>
  </Card>;

  const CompletedCard=<Card padding={0} radius={isD?20:22}>
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:isD?'14px 16px 8px':'14px 18px 8px'}}>
      <div style={{display:'flex',alignItems:'center',gap:8}}>
        <div style={{width:isD?8:6,height:isD?8:6,borderRadius:4,background:'var(--sys-green)'}}/>
        <div style={{fontSize:isD?14:15,fontWeight:600,color:'var(--text-1)',letterSpacing:-0.2}}>Completadas</div>
      </div>
      <div style={{fontSize:12,color:'var(--text-3)'}}>{completedTasks.length}</div>
    </div>
    <div style={{padding:isD?'0 4px 8px':'0 6px 8px'}}>
      {completedTasks.length===0&&<div style={{textAlign:'center',padding:isD?'20px 0':'14px 0',
        fontSize:13,color:'var(--text-3)',fontStyle:'italic'}}>Sin tareas completadas</div>}
      {completedTasks.map(t=>renderTask(t,t.__lane,t.__laneColor))}
    </div>
  </Card>;

  if(isD){
    return<div style={{padding:`0 ${px}px`}}>
      {!readOnly&&<div style={{marginBottom:16}}>{AddCard}</div>}
      <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:16,alignItems:'start'}}>
        {LANES.map(lane=><div key={lane.id} data-task-lane={lane.id} style={{minHeight:'100%'}}>
        <Card padding={0} radius={20} style={{height:'100%'}}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'14px 16px 8px'}}>
            <div style={{display:'flex',alignItems:'center',gap:8}}>
              <div style={{width:8,height:8,borderRadius:4,background:lane.color}}/>
              <div style={{fontSize:14,fontWeight:600,color:'var(--text-1)',letterSpacing:-0.2}}>{lane.label}</div>
              {lane.desc&&<span style={{fontSize:11,color:'var(--text-3)'}}>{lane.desc}</span>}
            </div>
            <span style={{fontSize:12,color:'var(--text-3)'}}>{activeTasks[lane.id].length}</span>
          </div>
          <div data-task-lane={lane.id}
            style={{padding:'0 4px 8px',minHeight:activeTasks[lane.id].length===0?68:0}}>
            {activeTasks[lane.id].length===0&&<div style={{textAlign:'center',padding:'20px 0',
              fontSize:13,color:'var(--text-3)',fontStyle:'italic'}}>Sin tareas</div>}
            {activeTasks[lane.id].map(t=>renderTask(t,lane.id,lane.color))}
          </div>
        </Card>
        </div>)}
      </div>
      {showCompleted&&<div style={{marginTop:16}}>{CompletedCard}</div>}
    </div>;
  }
  return<div style={{padding:'0 16px',display:'flex',flexDirection:'column',gap:14}}>
    {!readOnly&&AddCard}
    {LANES.map(lane=><div key={lane.id} data-task-lane={lane.id}>
    <Card padding={0} radius={22}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'14px 18px 8px'}}>
        <div style={{display:'flex',alignItems:'center',gap:8}}>
          <div style={{width:6,height:6,borderRadius:3,background:lane.color}}/>
          <div style={{fontSize:15,fontWeight:600,color:'var(--text-1)',letterSpacing:-0.2}}>{lane.label}</div>
          {lane.desc&&<span style={{fontSize:11,color:'var(--text-3)'}}>{lane.desc}</span>}
        </div>
        <div style={{fontSize:12,color:'var(--text-3)'}}>{activeTasks[lane.id].length}</div>
      </div>
      <div data-task-lane={lane.id}
        style={{padding:'0 6px 8px',minHeight:activeTasks[lane.id].length===0?58:0}}>
        {activeTasks[lane.id].length===0&&<div style={{textAlign:'center',padding:'14px 0',
          fontSize:13,color:'var(--text-3)',fontStyle:'italic'}}>Sin tareas</div>}
        {activeTasks[lane.id].map(t=>renderTask(t,lane.id,lane.color))}
      </div>
    </Card>
    </div>)}
    {showCompleted&&CompletedCard}
  </div>;
}

function HoyHabitos({habits,setHabits,setHabitTemplate,readOnly=false}){
  const isD=useD();
  const[newName,setNewName]=useState('');
  const[draggingId,setDraggingId]=useState(null);
  const dragIdRef=useRef(null);
  const habitsRef=useRef(habits);
  const habitDragCleanupRef=useRef(null);
  useEffect(()=>{habitsRef.current=habits;},[habits]);
  const doneH=habits.filter(h=>h.done).length;
  const pct=habits.length>0?Math.round(doneH/habits.length*100):0;
  function toggle(id){
    if(readOnly)return;
    setHabits(prev=>{
      const next=(prev||[]).map(h=>h.id===id?{...h,done:!h.done}:h);
      habitsRef.current=next;
      return next;
    });
  }
  function addHabit(){if(readOnly||!newName.trim())return;
    const habit={id:'h'+Date.now(),name:newName.trim()};
    setHabits(prev=>[...(prev||[]),{...habit,done:false}]);
    setHabitTemplate(prev=>[...habitTemplateFromDay(prev),habit]);
    setNewName('');}
  function removeHabit(id){
    if(readOnly)return;
    recordHabitDelete(id,TODAY_KEY);
    setHabits(prev=>prev.filter(h=>h.id!==id));
    setHabitTemplate(prev=>habitTemplateFromDay(prev).filter(h=>h.id!==id));
  }
  function orderedHabits(list,from,to){
    const arr=Array.isArray(list)?[...list]:[];
    if(from<0||to<0||from>=arr.length||to>=arr.length||from===to)return arr;
    const[item]=arr.splice(from,1);
    arr.splice(to,0,item);
    return arr;
  }
  function saveHabitOrder(next){
    habitsRef.current=next;
    setHabits(next);
    setHabitTemplate(habitTemplateFromDay(next));
  }
  function reorderDraggedHabit(targetId){
    const sourceId=dragIdRef.current||draggingId;
    if(!sourceId||!targetId||sourceId===targetId)return;
    const current=habitsRef.current||[];
    const from=current.findIndex(h=>h.id===sourceId);
    const to=current.findIndex(h=>h.id===targetId);
    saveHabitOrder(orderedHabits(current,from,to));
  }
  function beginHabitDrag(id,e){
    if(readOnly)return;
    e.preventDefault();
    if(habitDragCleanupRef.current)habitDragCleanupRef.current();
    dragIdRef.current=id;
    setDraggingId(id);
    const move=ev=>{ev.preventDefault();hoverHabitAtPoint(ev);};
    const up=ev=>endHabitDrag(ev);
    window.addEventListener('pointermove',move,{passive:false});
    window.addEventListener('pointerup',up,{passive:false});
    window.addEventListener('pointercancel',up,{passive:false});
    habitDragCleanupRef.current=()=>{
      window.removeEventListener('pointermove',move);
      window.removeEventListener('pointerup',up);
      window.removeEventListener('pointercancel',up);
      habitDragCleanupRef.current=null;
    };
  }
  function hoverHabitAtPoint(e){
    if(!dragIdRef.current)return;
    const el=document.elementFromPoint(e.clientX,e.clientY);
    const row=el&&el.closest?el.closest('[data-habit-id]'):null;
    const targetId=row?row.getAttribute('data-habit-id'):null;
    reorderDraggedHabit(targetId);
  }
  function endHabitDrag(e){
    if(e&&e.preventDefault)e.preventDefault();
    if(habitDragCleanupRef.current)habitDragCleanupRef.current();
    dragIdRef.current=null;
    setDraggingId(null);
  }
  const px=isD?52:14;
  return<div style={{padding:`0 ${px}px`,display:'flex',flexDirection:'column',gap:14}}>
    <div style={{display:isD?'grid':'flex',gridTemplateColumns:isD?'280px 1fr':undefined,flexDirection:'column',gap:14,alignItems:isD?'start':'stretch'}}>
      <Card radius={22} padding={20}>

          <Ring value={doneH} max={habits.length||1} size={90} stroke={9} color="var(--sys-green)">
            <div style={{textAlign:'center'}}>
              <div style={{fontFamily:'ui-rounded,-apple-system,system-ui',fontSize:22,fontWeight:700,
                color:'var(--sys-green)',letterSpacing:-0.8}}>
                {doneH}<span style={{fontSize:13,color:'var(--text-3)',fontWeight:500}}>/{habits.length}</span>
              </div>
            </div>
          </Ring>
          <div style={{flex:1}}>
            <div style={{fontSize:12,color:'var(--text-3)',fontWeight:500,letterSpacing:0.4,textTransform:'uppercase'}}>Hoy</div>
            <div style={{fontSize:20,fontWeight:700,color:'var(--text-1)',letterSpacing:-0.3,marginTop:2}}>{pct}% completado</div>
            <div style={{fontSize:13,color:'var(--text-3)',marginTop:4}}>Objetivo: {(()=>{try{const s=localStorage.getItem('zp_settings');return s?JSON.parse(s).habitGoal||80:80;}catch{return 80;}})()}%</div>
          </div>
        </div>
      </Card>
      <div style={{display:'flex',flexDirection:'column',gap:10,width:'100%'}}>
        {!readOnly&&<Card radius={16} padding={0}>
          <div style={{display:'flex',alignItems:'center',gap:10,padding:'10px 14px'}}>
            <IPlus size={16} style={{color:'var(--sys-green)',flexShrink:0}}/>
            <input value={newName} onChange={e=>setNewName(e.target.value)}
              onKeyDown={e=>e.key==='Enter'&&addHabit()} placeholder="Nuevo hábito…"
              style={{flex:1,fontSize:14,color:'var(--text-1)',background:'transparent',border:'none'}}/>
            <button onClick={addHabit} style={{padding:'5px 12px',borderRadius:8,
              background:'var(--sys-green)',color:'#fff',fontSize:12,fontWeight:600}}>Añadir</button>
          </div>
        </Card>}
        <Card padding={0} radius={22}>
          {habits.length===0&&<div style={{padding:'22px',textAlign:'center',
            fontSize:13,color:'var(--text-3)',fontStyle:'italic'}}>Sin hábitos · pulsa Añadir para crear el primero</div>}
          {habits.map((h,i)=><div key={h.id} data-habit-id={h.id} onClick={()=>toggle(h.id)}
            style={{display:'flex',alignItems:'center',gap:10,padding:'14px 18px',
              borderBottom:i<habits.length-1?'0.5px solid var(--separator)':'none',
              background:draggingId===h.id?'var(--fill-1)':'transparent',
              opacity:draggingId===h.id?0.62:1,cursor:'pointer',userSelect:'none'}}>
            {!readOnly&&<div title="Arrastrar para ordenar" aria-label="Arrastrar hábito"

              style={{width:22,height:28,display:'flex',alignItems:'center',justifyContent:'center',
                color:'var(--text-3)',cursor:'grab',flexShrink:0,touchAction:'none'}}>
              <IGrip size={17}/>
            </div>}
            <button type="button" aria-label={h.done?'Marcar hábito como pendiente':'Marcar hábito como completado'}
              style={{width:22,height:22,borderRadius:7,flexShrink:0,cursor:'pointer',
              border:h.done?'none':'1.5px solid var(--separator-strong)',
              background:h.done?'var(--sys-green)':'transparent',

              {h.done&&<ICheck size={14}/>}
            </button>
            <div style={{flex:1,cursor:'pointer',fontSize:15,

            {!readOnly&&<button onClick={e=>{e.stopPropagation();removeHabit(h.id);}}

// ── SEMANAL ───────────────────────────────────────────────────────────────────
function SemanalScreen(){
  const isD=useD();
  const readLS=k=>{try{const s=localStorage.getItem(k);return s&&s!=='undefined'?JSON.parse(s):null;}catch{return null;}};
  const monday=(()=>{const d=new Date(TODAY);const wd=(d.getDay()+6)%7;d.setDate(d.getDate()-wd);d.setHours(0,0,0,0);return d;})();
  const DAY_LABELS=['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
  const DAYS=DAY_LABELS.map((lbl,i)=>{
    const dt=new Date(monday);dt.setDate(monday.getDate()+i);
    const key=dateKey(dt.getFullYear(),dt.getMonth(),dt.getDate());
    const isFuture=dt>TODAY&&dt.toDateString()!==TODAY.toDateString();
    const isToday=dt.toDateString()===TODAY.toDateString();
    const weekend=i>=5;
    const h=readLS('zp_habits_'+key);
    const t=readLS('zp_tasks_'+key);
    const mn=readLS('zp_mental_'+key);
    const hAny=Array.isArray(h)&&h.some(x=>x&&x.done);
    const tAny=t&&((t.top3||[]).some(x=>x&&x.done)||(t.enfoque||[]).some(x=>x&&x.done)||(t.parking||[]).some(x=>x&&x.done));
    const mAny=Array.isArray(mn)&&mn.some(x=>x&&(x.state==='bien'||x.state==='mal'));
    let score=null;
    if(!isFuture&&!weekend&&(hAny||tAny||mAny))score=calcScore(h||[],t||{top3:[]},mn||[]);
    return{d:lbl,n:dt.getDate(),score,today:isToday,key,weekend};
  });
  const evalD=DAYS.filter(d=>d.score!==null);
  const avg=evalD.length>0?evalD.reduce((a,b)=>a+b.score,0)/evalD.length:null;
  const best=evalD.length>0?Math.max(...evalD.map(d=>d.score)):null;
  const bestDay=best!=null?DAYS.find(d=>d.score===best):null;
  const daysGE8=evalD.filter(d=>d.score>=8).length;
  const weekHabitMap=new Map();
  DAYS.forEach(day=>{
    const dh=readLS('zp_habits_'+day.key);
    if(Array.isArray(dh))dh.forEach(h=>{
      if(h&&h.id&&h.name&&!weekHabitMap.has(h.id))weekHabitMap.set(h.id,{id:h.id,name:h.name});
    });
  });
  if(weekHabitMap.size===0)habitTemplateFromDay(readLS(HABIT_TEMPLATE_KEY)||[]).forEach(h=>weekHabitMap.set(h.id,h));
  const habits=Array.from(weekHabitMap.values()).map(h=>{
    let done=0,total=0;
    DAYS.forEach(day=>{
      if(day.weekend)return;
      const dh=readLS('zp_habits_'+day.key);
      if(Array.isArray(dh)){
        const m=dh.find(x=>x.id===h.id||x.name===h.name);
        if(m){total++;if(m.done)done++;}
      }
    });
    return{name:h.name,done,total:total||5};
  });
  const px=isD?52:14;
  const MES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  const lastDay=new Date(monday);lastDay.setDate(monday.getDate()+6);
  const sameMonth=monday.getMonth()===lastDay.getMonth();
  const titleRange=sameMonth
    ?`${monday.getDate()}–${lastDay.getDate()} ${MES[monday.getMonth()]}`
    :`${monday.getDate()} ${MES[monday.getMonth()]} – ${lastDay.getDate()} ${MES[lastDay.getMonth()]}`;
  return<div style={{display:'flex',flexDirection:'column',flex:1,minHeight:0,height:'100%'}}>
    <NavHeader eyebrow={`SEMANA ${getWeekNum()}`} title={titleRange}
      right={<div style={{display:'flex',gap:6}}>
        <GlassPillBtn icon={<IChev size={16} style={{transform:'scaleX(-1)'}}/>}/>
        <GlassPillBtn icon={<IChev size={16}/>}/>
      </div>}/>
    <div className="scroll zp-page" style={{flex:1,minHeight:0,paddingBottom:14}}>
      <div style={{padding:`0 ${px}px`,display:'flex',flexDirection:'column',gap:isD?14:10}}>
        <div style={{display:'grid',gridTemplateColumns:isD?'repeat(4,1fr)':'1fr 1fr',gap:isD?10:8}}>
          <MetricTile label="Media" value={avg!=null?avg.toFixed(1):'—'} unit={avg!=null?'/10':''} color={scoreHue(avg)} sub={avg!=null?'esta semana':'sin datos'}/>
          <MetricTile label="Mejor día" value={best!=null?best.toFixed(1):'—'} color={scoreHue(best)} sub={bestDay?{Lun:'lunes',Mar:'martes',Mié:'miércoles',Jue:'jueves',Vie:'viernes',Sáb:'sábado',Dom:'domingo'}[bestDay.d]:''}/>
          <MetricTile label="Días ≥ 8" value={daysGE8} unit={`/${evalD.length||0}`} color="var(--sys-green)"/>
          <MetricTile label="Evaluados" value={evalD.length} unit="/7" color="var(--accent)"/>
        </div>
        <div style={{display:isD?'grid':'flex',gridTemplateColumns:isD?'1fr 1fr':undefined,flexDirection:'column',gap:isD?14:10}}>
          <Card radius={20} padding={isD?18:14}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:isD?14:10}}>
              <div style={{fontSize:isD?18:13.5,fontWeight:600,color:'var(--text-1)',letterSpacing:-0.3}}>Rendimiento diario</div>
              <div style={{fontSize:isD?12:11,color:'var(--text-3)'}}>0 → 10</div>
            </div>
            <div style={{display:'grid',gridTemplateColumns:'repeat(7,1fr)',gap:isD?8:5,alignItems:'end'}}>
              {DAYS.map((d,i)=>{
                const pct=d.score!==null?d.score/10:0;
                const col=d.score!==null?scoreHue(d.score):'var(--fill-2)';
                return<div key={i} style={{display:'flex',flexDirection:'column',alignItems:'center',gap:isD?6:4}}>
                  <div style={{fontSize:isD?11:10,color:d.score!==null?col:'var(--text-3)',fontWeight:600}}>
                    {d.score!==null?d.score.toFixed(1):'—'}
                  </div>
                  <div style={{width:'100%',height:isD?86:64,background:'var(--fill-1)',borderRadius:8,
                    display:'flex',alignItems:'flex-end',overflow:'hidden',
                    border:d.today?`1.5px solid ${col}`:'0.5px solid var(--separator)'}}>
                    <div style={{width:'100%',height:d.score!==null?`${pct*100}%`:0,
                      background:`linear-gradient(180deg,${col}cc,${col})`,
                      borderRadius:pct<1?'0 0 7px 7px':8,transition:'height 0.5s'}}/>
                  </div>
                  <div style={{fontSize:isD?11:10,color:d.today?'var(--accent)':'var(--text-3)',fontWeight:d.today?600:500}}>{d.d}</div>
                  <div style={{fontSize:isD?10:9.5,color:'var(--text-3)'}}>{d.n}</div>
                </div>;
              })}
            </div>
          </Card>
          <Card padding={0} radius={20}>
            <div style={{padding:isD?'14px 18px 10px':'10px 14px 8px'}}>
              <div style={{fontSize:isD?18:13.5,fontWeight:600,color:'var(--text-1)',letterSpacing:-0.3}}>Hábitos de la semana</div>
            </div>
            {habits.length===0?(
              <div style={{padding:isD?'18px':'14px',borderTop:'0.5px solid var(--separator)',fontSize:isD?13:12,color:'var(--text-3)',textAlign:'center'}}>
                Aún no has añadido hábitos.
              </div>
            ):habits.map((h,i)=>{
              const pct=h.done/h.total;
              const col=pct>=0.8?'var(--sys-green)':pct>=0.5?'var(--sys-amber)':'var(--sys-red)';
              return<div key={i} style={{padding:isD?'10px 18px':'8px 14px',borderTop:'0.5px solid var(--separator)',
                display:'grid',gridTemplateColumns:isD?'1fr 40px 100px':'1fr 36px 80px',gap:isD?10:8,alignItems:'center'}}>
                <div style={{fontSize:isD?13:12.5,color:'var(--text-1)',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{h.name}</div>
                <div style={{fontSize:isD?11:10.5,color:col,fontWeight:600,textAlign:'right'}}>{h.done}/{h.total}</div>
                <LinearProgress value={h.done} max={h.total} color={col} thickness={4}/>
              </div>;
            })}
          </Card>
        </div>
        {TODAY.getDay()===0&&<div style={{padding:'12px 16px',borderRadius:16,background:'var(--sys-indigo-soft)',
          border:'0.5px solid var(--sys-indigo-soft-strong)',fontSize:13,color:'var(--sys-indigo)',lineHeight:1.5}}>
          <strong>Review del domingo:</strong> completa la revisión profunda y define el Top 3 de la próxima semana.
        </div>}
      </div>
    </div>
  </div>;
}

  const[newColor,setNewColor]=useState('#3B82F6');
  const[newType,setNewType]=useState('recordatorio');
  const[newRemind,setNewRemind]=useState(false);
  const[newRepeatUnit,setNewRepeatUnit]=useState('none');
  const[newRepeatEvery,setNewRepeatEvery]=useState(1);
  const[newTaskText,setNewTaskText]=useState('');
  const[newTaskLane,setNewTaskLane]=useState('enfoque');
  const[newTaskDuration,setNewTaskDuration]=useState(defaultTaskDuration('enfoque'));
  const[newTaskStartTime,setNewTaskStartTime]=useState('');
  const[editTime,setEditTime]=useState('');
  const[editTitle,setEditTitle]=useState('');
  const[editColor,setEditColor]=useState('#3B82F6');
  const[editType,setEditType]=useState('recordatorio');
  const[editRemind,setEditRemind]=useState(false);
  const[editRepeatUnit,setEditRepeatUnit]=useState('none');
  const[editRepeatEvery,setEditRepeatEvery]=useState(1);
  const[taskVersion,setTaskVersion]=useState(0);
  const[notifPermission,setNotifPermission]=useState(typeof Notification!=='undefined'?Notification.permission:'unsupported');
  const[pushSubscribed,setPushSubscribed]=useState(false);
  const[pushBusy,setPushBusy]=useState(false);
  const[pushMsg,setPushMsg]=useState('');
  const{y,m}=vm;

  useEffect(()=>{
    let cancelled=false;
    const syncPermission=async()=>{
      const st=await getPushStatus();
      if(cancelled)return;
      setNotifPermission(st.permission);
      setPushSubscribed(!!st.subscribed);
    };
    syncPermission();
    window.addEventListener('focus',syncPermission);
    return()=>{cancelled=true;window.removeEventListener('focus',syncPermission);};
  },[]);
  const firstDay=new Date(y,m,1);
  const daysInMonth=new Date(y,m+1,0).getDate();
  const firstOffset=(firstDay.getDay()+6)%7;
  const days=[];
  for(let i=0;i<firstOffset;i++)days.push({pad:true});
  for(let n=1;n<=daysInMonth;n++){
    const key=dateKey(y,m,n);
    const cnt=getEventsForDate(calEvents,key).length;
    const isToday=n===d.getDate()&&m===d.getMonth()&&y===d.getFullYear();
    const isFuture=new Date(y,m,n)>d;
    const type=dayTypes[key]||null;
    const weekend=isWeekendKey(key);
    const score=type||isFuture||weekend?null:dayScore(key);
    days.push({d:n,today:isToday,cnt,key,type,weekend,score});
  }
  while(days.length%7)days.push({pad:true});

  const scoredDays=days.filter(c=>!c.pad&&c.score!==null);
  const avg=scoredDays.length>0?(scoredDays.reduce((a,c)=>a+c.score,0)/scoredDays.length).toFixed(1):'—';
  const best=scoredDays.length>0?Math.max(...scoredDays.map(c=>c.score)).toFixed(1):'—';
  const evalCount=scoredDays.length;
  const specialCount=days.filter(c=>!c.pad&&(c.type||c.weekend)).length;

  function setType(key,type){
    if(type===null){setDayTypes(p=>{const n={...p};delete n[key];return n;});}
    else{setDayTypes(p=>({...p,[key]:type}));}
  }

  const selKey=dateKey(y,m,selDay);
  const selType=dayTypes[selKey]||null;
  const dayEvs=getEventsForDate(calEvents,selKey);
  const dayTasks=React.useMemo(()=>readTasksForDate(selKey),[selKey,taskVersion]);
  const scheduledForSelectedDay=task=>!task?.createdDate||task.createdDate===selKey;
  const allDayTasks=[
    ...(dayTasks.top3||[]).filter(scheduledForSelectedDay).map(t=>({...t,__lane:'top3'})),
    ...(dayTasks.enfoque||[]).filter(scheduledForSelectedDay).map(t=>({...t,__lane:'enfoque'})),
    ...(dayTasks.parking||[]).filter(scheduledForSelectedDay).map(t=>({...t,__lane:'parking'})),
  ];
  const selLabel=`${DAYS_ES[new Date(y,m,selDay).getDay()].charAt(0).toUpperCase()+
    DAYS_ES[new Date(y,m,selDay).getDay()].slice(1)} ${selDay} ${MONTHS_ES[m]}`;
  const LANE_META={
    top3:{label:'Top 3',color:'var(--accent)'},
    enfoque:{label:'En Foco',color:'var(--sys-purple)'},
    parking:{label:'Parking',color:'var(--text-3)'},
  };
  useEffect(()=>{
    const syncTasks=e=>{
      const k=e?.detail?.key;
      if(!k||k===taskStorageKey(selKey))setTaskVersion(v=>v+1);
    };
    window.addEventListener('zp-ls',syncTasks);
    return()=>window.removeEventListener('zp-ls',syncTasks);
  },[selKey]);

  function resetAddForm(){
    setNewTitle('');setNewTime('');setNewColor('#3B82F6');setNewType('recordatorio');setNewRemind(false);setNewRepeatUnit('none');setNewRepeatEvery(1);
  }
  function resetTaskForm(){
    setNewTaskText('');setNewTaskLane('enfoque');setNewTaskDuration(defaultTaskDuration('enfoque'));setNewTaskStartTime('');
  }
  function closeEditor(){
    setEditingId('');setEditingBaseKey('');
    setEditTitle('');setEditTime('');setEditColor('#3B82F6');setEditType('recordatorio');setEditRemind(false);setEditRepeatUnit('none');setEditRepeatEvery(1);
  }
  function addEvent(){
    if(!newTitle.trim())return;
    const ev={id:'ev'+Date.now(),time:newTime||'00:00',title:newTitle.trim(),color:newColor,type:newType,
      remind:newRemind,repeatUnit:newRepeatUnit,repeatEvery:newRepeatUnit==='none'?1:Math.max(1,parseInt(newRepeatEvery,10)||1)};
    setCalEvents(p=>({...p,[selKey]:[...(p[selKey]||[]),ev]}));
    resetAddForm();setAdding(false);
  }
  function deleteEvent(baseKey,id){
    setCalEvents(p=>({...p,[baseKey]:(p[baseKey]||[]).filter(e=>e.id!==id)}));
    if(editingId===id&&editingBaseKey===baseKey)closeEditor();
  }
  function addAgendaTask(){
    if(!newTaskText.trim())return;
    if(newTaskLane==='top3'&&(dayTasks.top3||[]).filter(scheduledForSelectedDay).length>=3){alert('Top 3 solo admite 3 tareas.');return;}
    const id='t'+Date.now();
    writeTasksForDate(selKey,prev=>({
      ...prev,
      [newTaskLane]:[...(prev[newTaskLane]||[]),makeTask(id,newTaskText.trim(),selKey,newTaskLane,{
        durationMinutes:newTaskDuration,
        startTime:newTaskStartTime,
      })],
    }));
    resetTaskForm();
    setAddingTask(false);
    setTaskVersion(v=>v+1);
  }
  function toggleAgendaTask(lane,id,currentDone){
    writeTasksForDate(selKey,prev=>{
      const result=toggleTaskInBuckets(prev,lane,id,!currentDone,currentDone);
      if(result.done)recordTaskCompletion(id,result.completedAt);
      else clearTaskCompletion(id);
      return result.tasks;
    });
    setTaskVersion(v=>v+1);
  }
  function moveAgendaTask(fromLane,toLane,id){
    if(fromLane===toLane)return;
    if(toLane==='top3'&&(dayTasks.top3||[]).filter(t=>scheduledForSelectedDay(t)&&t.id!==id).length>=3){alert('Top 3 solo admite 3 tareas.');return;}
    writeTasksForDate(selKey,prev=>{
      const task=(prev[fromLane]||[]).find(t=>t.id===id);
      if(!task)return prev;
      return{
        ...prev,
        [fromLane]:(prev[fromLane]||[]).filter(t=>t.id!==id),
        [toLane]:[touchTask(task,toLane),...(prev[toLane]||[])],
      };
    });
    setTaskVersion(v=>v+1);
  }
  function deleteAgendaTask(lane,id){
    recordTaskDelete(id);
    writeTasksForDate(selKey,prev=>({
      ...prev,
      [lane]:(prev[lane]||[]).filter(t=>t.id!==id),
    }));
    setTaskVersion(v=>v+1);
  }
  function startEditEvent(ev){
    setAdding(false);
    setAddingTask(false);
    setEditingId(ev.id||'');
    setEditingBaseKey(ev.__baseKey||selKey);
    setEditTime(ev.time||'00:00');
    setEditTitle(ev.title||'');
    setEditColor(ev.color||'#3B82F6');
    setEditType(ev.type||ev.eventType||'recordatorio');
    setEditRemind(!!ev.remind);
    setEditRepeatUnit(ev.repeatUnit||'none');
    setEditRepeatEvery(Math.max(1,parseInt(ev.repeatEvery,10)||1));
  }
  function saveEditEvent(){
    if(!editingId||!editingBaseKey||!editTitle.trim())return;
    const nextEvery=editRepeatUnit==='none'?1:Math.max(1,parseInt(editRepeatEvery,10)||1);
    setCalEvents(p=>({
      ...p,
      [editingBaseKey]:(p[editingBaseKey]||[]).map(ev=>ev.id===editingId
        ?{...ev,time:editTime||'00:00',title:editTitle.trim(),color:editColor,type:editType,remind:editRemind,repeatUnit:editRepeatUnit,repeatEvery:nextEvery}
        :ev)
    }));
    closeEditor();
  }
  async function enableNotifications(){
    setPushBusy(true);setPushMsg('');
    try{
      const st=await registerPushSubscription();
      setNotifPermission(st.permission||'granted');
      setPushSubscribed(true);
      setPushMsg('Notificaciones activadas en este dispositivo.');
    }catch(err){
      setPushMsg(err?.message||'No se pudo activar el dispositivo.');
      const st=await getPushStatus();
      setNotifPermission(st.permission);
      setPushSubscribed(!!st.subscribed);
    }finally{setPushBusy(false);}
  }
  async function disableNotifications(){
    setPushBusy(true);setPushMsg('');
    try{
      const st=await unregisterPushSubscription();
      setNotifPermission(st.permission||notifPermission);
      setPushSubscribed(false);
      setPushMsg('Notificaciones desactivadas en este dispositivo.');
    }catch(err){
      setPushMsg(err?.message||'No se pudo desactivar el dispositivo.');
    }finally{setPushBusy(false);}
  }

  const px=isD?52:14;

  const CalGrid=<Card radius={18} padding={isD?14:10} style={{background:'linear-gradient(180deg,var(--surface-1),var(--surface-ink))'}}>
    <div style={{display:'grid',gridTemplateColumns:'repeat(7,1fr)',gap:isD?5:3,marginBottom:8}}>
      {['L','M','X','J','V','S','D'].map(x=><div key={x} style={{textAlign:'center',fontSize:10.5,color:'var(--text-3)',fontWeight:700,letterSpacing:0.3}}>{x}</div>)}
    </div>
    <div style={{display:'grid',gridTemplateColumns:'repeat(7,1fr)',gap:isD?5:3}}>
      {days.map((c,i)=>{
        if(c.pad)return<div key={i} style={{aspectRatio:'1',opacity:0.3}}/>;
        const sel=c.d===selDay;
        const cfg=c.type?DAY_TYPE_CFG[c.type]:null;
        const wkOnly=!cfg&&c.weekend;
	        const scoreCol=c.score!==null?scoreHue(c.score):null;
	        const cellBg=sel?'var(--accent)':c.today?'var(--fill-2)':cfg?cfg.soft:'var(--calendar-cell-bg)';
	        const cellBorder=sel?'1.5px solid var(--accent)':c.today?'1.5px solid var(--accent)'
	          :cfg?`1px solid ${cfg.border}`:'1px solid var(--calendar-cell-border)';
	        const accentLine=sel?'transparent':cfg?cfg.color:scoreCol||'transparent';
	        const excludedLine=cfg||(wkOnly?WEEKEND_CFG:null);
	        return<div key={i} onClick={()=>setSelDay(c.d)}
	          style={{aspectRatio:'1',background:cellBg,border:cellBorder,borderRadius:10,
	            display:'flex',flexDirection:'column',justifyContent:'space-between',padding:isD?7:4,cursor:'pointer',minHeight:0,
	            boxShadow:accentLine!=='transparent'?`inset 0 -3px 0 ${accentLine}`:'none',
	            position:'relative',overflow:'hidden'}}>
	          {excludedLine&&<div style={{position:'absolute',left:'-18%',top:'50%',width:'136%',height:1,
	            background:sel?'var(--accent-ink)':excludedLine.color,opacity:sel?0.28:0.34,
	            transform:'rotate(-45deg)',transformOrigin:'center',pointerEvents:'none'}}/>}
	          <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',gap:2}}>
            <div style={{fontSize:isD?12:10.5,fontWeight:sel||c.today?700:600,
              color:sel?'var(--accent-ink)':c.today?'var(--accent)':'var(--text-1)',letterSpacing:-0.1,lineHeight:1}}>{c.d}</div>
            {cfg&&<span style={{display:'flex',color:cfg.color,lineHeight:1,background:'var(--fill-1)',borderRadius:999,padding:2}}>
              <cfg.Icon size={isD?10:9} sw={1.8}/>
            </span>}
          </div>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-end',gap:2}}>
            {c.cnt>0
              ?<div style={{display:'flex',gap:2}}>
                {Array.from({length:Math.min(c.cnt,3)}).map((_,j)=><div key={j} style={{
                  width:3,height:3,borderRadius:2,background:sel?'var(--accent-ink)':'var(--accent)',opacity:sel?0.75:1}}/>)}
              </div>
              :<span/>}
            {wkOnly
              ?<div style={{fontSize:isD?9:8,fontWeight:600,color:sel?'var(--accent-ink)':WEEKEND_CFG.color,letterSpacing:0.2,lineHeight:1}}>finde</div>
              :c.score!==null
                ?<div style={{fontSize:isD?10:9,fontFamily:'ui-rounded,-apple-system,system-ui',
                    fontWeight:700,color:sel?'var(--accent-ink)':scoreCol,background:sel?'rgba(33,22,14,0.12)':scoreHueSoft(c.score),
                    padding:'2px 5px',borderRadius:999,letterSpacing:-0.3,lineHeight:1}}>
                    {c.score.toFixed(1)}
                  </div>
                :<span/>}
          </div>
        </div>;
      })}
    </div>
  </Card>;

  const EventPanel=<div style={{display:'flex',flexDirection:'column',gap:10}}>
    <Card radius={18} padding={14} style={{background:'linear-gradient(180deg,var(--surface-1),var(--surface-ink))'}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',gap:12}}>
        <div style={{minWidth:0}}>
          <div style={{fontSize:16,fontWeight:700,color:'var(--text-1)',letterSpacing:-0.25}}>{selLabel}</div>
          <div style={{fontSize:12,color:'var(--text-3)',marginTop:3}}>{dayEvs.length} evento{dayEvs.length!==1?'s':''} · {allDayTasks.length} tarea{allDayTasks.length!==1?'s':''}</div>
        </div>
        <div style={{display:'flex',alignItems:'center',gap:6,flexShrink:0}}>
          <button onClick={()=>{setAddingTask(false);setAdding(v=>!v);}} style={{display:'flex',alignItems:'center',gap:6,
            padding:'8px 12px',borderRadius:12,background:'var(--accent)',color:'var(--accent-ink)',
            fontSize:12.5,fontWeight:700}}>
            <IPlus size={14}/> Evento
          </button>
          <button onClick={()=>{setAdding(false);closeEditor();setAddingTask(v=>!v);}} style={{display:'flex',alignItems:'center',gap:6,
            padding:'8px 12px',borderRadius:12,background:'var(--fill-1)',color:'var(--text-2)',
            fontSize:12.5,fontWeight:700}}>
            <IPlus size={14}/> Tarea
          </button>
        </div>
      </div>
      <div style={{display:'flex',alignItems:'center',gap:8,flexWrap:'wrap',marginTop:12,paddingTop:12,borderTop:'1px solid var(--separator)'}}>

          {pushSubscribed?'Dispositivo suscrito':notifPermission==='denied'?'Avisos bloqueados':'Dispositivo no suscrito'}
        </Chip>
        {pushSupported()&&!pushSubscribed&&notifPermission!=='unsupported'&&<button onClick={enableNotifications} disabled={pushBusy}
          style={{padding:'6px 12px',borderRadius:999,background:'var(--fill-1)',fontSize:12,fontWeight:700,color:'var(--text-2)'}}>
          {pushBusy?'Activando…':'Activar notificaciones'}

        {pushSupported()&&pushSubscribed&&<button onClick={enableNotifications} disabled={pushBusy}

          {pushBusy?'Reactivando…':'Reactivar'}

        {pushSupported()&&pushSubscribed&&<button onClick={disableNotifications} disabled={pushBusy}
          style={{padding:'6px 12px',borderRadius:999,background:'var(--fill-1)',fontSize:12,fontWeight:700,color:'var(--text-2)'}}>
          {pushBusy?'Quitando…':'Desactivar en este dispositivo'}

        {notifPermission==='unsupported'&&<span style={{fontSize:11,color:'var(--text-3)'}}>Este navegador no soporta avisos locales.</span>}
        {pushMsg&&<span style={{fontSize:11,color:pushSubscribed?'var(--sys-green)':'var(--text-3)'}}>{pushMsg}</span>}

      <div style={{display:isD?'flex':'grid',gridTemplateColumns:isD?undefined:'100px 1fr',gap:8,marginBottom:10}}>

          style={{width:100,fontSize:14,color:'var(--text-1)',background:'var(--fill-1)',
            border:'0.5px solid var(--hairline)',borderRadius:8,padding:'7px 10px'}}/>
        <input value={newTitle} onChange={e=>setNewTitle(e.target.value)} autoFocus
          onKeyDown={e=>e.key==='Enter'&&addEvent()} placeholder="Título del evento…"
          style={{flex:1,fontSize:14,color:'var(--text-1)',background:'var(--fill-1)',
            border:'0.5px solid var(--hairline)',borderRadius:8,padding:'7px 10px'}}/>
      </div>
      <div style={{display:'flex',gap:8,marginBottom:12}}>
        {EVENT_COLORS.map(ec=><button key={ec.id} onClick={()=>setNewColor(ec.hex)}
          style={{width:26,height:26,borderRadius:13,background:ec.hex,
            boxShadow:newColor===ec.hex?`0 0 0 2.5px var(--surface-1),0 0 0 4.5px ${ec.hex}`:'none',
            display:'flex',alignItems:'center',justifyContent:'center'}}>
          {newColor===ec.hex&&<ICheck size={13} style={{color:'#fff'}}/>}

  const MetricsRow=<div style={{display:'grid',gridTemplateColumns:isD?'repeat(4,1fr)':'1fr 1fr',gap:isD?10:8}}>

      <span style={{fontSize:10.5,fontWeight:700,color:'var(--text-2)'}}>{cfg.label}</span>

  const Reflection=<Card radius={20} padding={16} style={{display:'flex',flexDirection:'column',gap:10}}>

  </Card>;

  return<div style={{display:'flex',flexDirection:'column',flex:1,minHeight:0,height:'100%'}}>
