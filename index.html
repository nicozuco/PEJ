            border:'0.5px solid var(--hairline)',borderRadius:10,padding:'9px 11px',fontFamily:'inherit',lineHeight:1.45,marginBottom:10}}/>
        <input value={editingItem.tags} onChange={e=>setEditingItem(v=>({...v,tags:e.target.value}))}
          placeholder="Etiquetas separadas por coma"
          style={{width:'100%',fontSize:12.5,color:'var(--text-1)',background:'var(--surface-1)',
            border:'0.5px solid var(--hairline)',borderRadius:10,padding:'8px 11px',fontFamily:'inherit',marginBottom:10}}/>
        <div style={{display:'flex',justifyContent:'flex-end',gap:8}}>
          <button onClick={()=>setEditingItem(null)} style={{padding:'7px 13px',borderRadius:10,
            background:'var(--fill-1)',color:'var(--text-3)',fontSize:13,fontWeight:600}}>Cancelar</button>
          <button onClick={saveEditItem} disabled={!editingItem.title.trim()} style={{padding:'7px 14px',borderRadius:10,
            background:editingItem.title.trim()?'var(--accent)':'var(--fill-2)',
            color:editingItem.title.trim()?'var(--accent-ink)':'var(--text-3)',fontSize:13,fontWeight:700}}>Guardar</button>
        </div>
      </div>;
      return<div key={item.id} style={{padding:isD?'14px 18px':'12px 14px',borderTop:i>0?'0.5px solid var(--separator)':'none'}}>
        <div style={{display:'flex',gap:12,alignItems:'flex-start'}}>
          <button onClick={()=>openItem(item)} style={{width:38,height:38,borderRadius:11,background:`${typeMeta.color}22`,
            color:typeMeta.color,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
            <IContent size={19}/>
          </button>
          <div style={{flex:1,minWidth:0}}>
            <div onClick={()=>openItem(item)} style={{fontSize:isD?15:14,fontWeight:700,color:'var(--text-1)',letterSpacing:-0.25,
              lineHeight:1.3,cursor:item.url?'pointer':'default'}}>{item.title}</div>
            <div style={{display:'flex',gap:6,alignItems:'center',flexWrap:'wrap',marginTop:6}}>
              <Chip tint={typeMeta.color}>{typeMeta.label}</Chip>
              {item.platform&&<Chip tint="var(--accent)">{item.platform}</Chip>}
              {item.format&&<Chip tint="var(--sys-purple)">{item.format}</Chip>}
              <Chip tint={statusMeta.color}>{statusMeta.label}</Chip>
              {item.topic&&item.topic!==item.platform&&<Chip tint="var(--sys-indigo)">{item.topic}</Chip>}
              {item.url&&<span style={{fontSize:11,color:'var(--text-3)'}}>{contentHost(item.url)}</span>}
            </div>
            {item.note&&<div style={{fontSize:12.5,color:'var(--text-2)',lineHeight:1.45,marginTop:8}}>{item.note}</div>}
            {Array.isArray(item.tags)&&item.tags.length>0&&<div style={{display:'flex',gap:5,flexWrap:'wrap',marginTop:8}}>
              {item.tags.map(t=><span key={t} style={{fontSize:10.5,color:'var(--text-3)',background:'var(--fill-1)',borderRadius:999,padding:'2px 7px'}}>{t}</span>)}
            </div>}
          </div>
          <div style={{display:'flex',gap:5,flexShrink:0}}>
            <button onClick={()=>startEditItem(item)}
              style={{height:28,padding:'0 10px',borderRadius:14,background:'var(--fill-1)',color:'var(--text-2)',
                display:'flex',alignItems:'center',justifyContent:'center',fontSize:11,fontWeight:700}}>
              Editar
            </button>
            <button onClick={()=>patchItem(item.id,{status:item.status==='visto'?'pendiente':'visto'})}
              style={{width:28,height:28,borderRadius:14,background:'var(--fill-1)',color:item.status==='visto'?'var(--sys-green)':'var(--text-3)',display:'flex',alignItems:'center',justifyContent:'center'}}>
              <ICheck size={14}/>
            </button>
            <button onClick={()=>patchItem(item.id,{status:item.status==='favorito'?'pendiente':'favorito'})}
              style={{width:28,height:28,borderRadius:14,background:'var(--fill-1)',color:item.status==='favorito'?'var(--sys-red)':'var(--text-3)',fontSize:14,fontWeight:700}}>★</button>
            <button onClick={()=>removeItem(item.id)}
              style={{width:28,height:28,borderRadius:14,background:'var(--fill-1)',color:'var(--text-3)',display:'flex',alignItems:'center',justifyContent:'center'}}>
              <IClose size={12}/>
            </button>
          </div>
        </div>
      </div>;
    })}
  </Card>;

  const Body=<div className="scroll zp-page" style={{flex:1,minHeight:0,paddingBottom:14}}>
      <div style={{padding:`0 ${px}px`,display:'flex',flexDirection:'column',gap:isD?14:10}}>
        <div style={{display:isD?'grid':'flex',gridTemplateColumns:isD?'minmax(0,1fr) 240px':undefined,flexDirection:'column',gap:isD?14:10,minWidth:0}}>
          <div style={{display:'flex',flexDirection:'column',gap:isD?14:10,minWidth:0}}>
            {AddCard}
            {FilterRow}
            {ItemList}
          </div>
          {isD&&<div style={{display:'flex',flexDirection:'column',gap:10}}>
            <MetricTile label="Pendiente" value={counts.pendiente} color="var(--sys-amber)"/>
            <MetricTile label="Favoritos" value={counts.favorito} color="var(--sys-red)"/>
            <MetricTile label="Videos" value={counts.video} color="var(--accent)"/>
          </div>}
        </div>
      </div>
    </div>;
  if(embedded)return Body;
  return<div style={{display:'flex',flexDirection:'column',flex:1,minHeight:0,height:'100%'}}>
    <NavHeader eyebrow="CONTENIDO" title="Biblioteca" subtitle={`${items.length} guardados`}/>
    {Body}
  </div>;
}

  const[syncMsg,setSyncMsg]=useState('');

  const[editName,setEditName]=useState(false);
  const[nameVal,setNameVal]=useState(userDisplayName(user));
  const[savingName,setSavingName]=useState(false);
  const[importErr,setImportErr]=useState('');

  function setSetting(k,v){setSettings(prev=>({...(prev||{}), [k]:v}));}

  function lastSyncLabel(){
    try{
      const s=localStorage.getItem('zp_last_sync');
      if(!s)return'Nunca';
      const d=new Date(s);
      const diff=Math.floor((Date.now()-d)/1000);
      if(diff<60)return'Hace un momento';
      if(diff<3600)return`Hace ${Math.floor(diff/60)} min`;
      if(diff<86400)return`Hace ${Math.floor(diff/3600)} h`;
      return d.toLocaleDateString('es-ES',{day:'numeric',month:'short'});
    }catch{return'—';}
  }

  async function doSync(){
    if(syncing)return;
    setSyncing(true);setSyncMsg('');
    try{
      if(window.zpForcePush)await window.zpForcePush();
      if(window.zpResync)await window.zpResync();
      setSyncMsg('Sincronizado');
    }catch{setSyncMsg('Error');}
    setSyncing(false);
    setTimeout(()=>setSyncMsg(''),3000);
  }

  function doExport(){
    try{
      const data={};
      for(let i=0;i<localStorage.length;i++){
        const k=localStorage.key(i);
        if(!k||!k.startsWith('zp_'))continue;
        try{data[k]=JSON.parse(localStorage.getItem(k));}catch{data[k]=localStorage.getItem(k);}
      }
      const blob=new Blob([JSON.stringify({exportedAt:new Date().toISOString(),user:user?.email||null,data},null,2)],{type:'application/json'});
      const url=URL.createObjectURL(blob);
      const a=document.createElement('a');a.href=url;a.download=`zuppej-export-${TODAY_KEY}.json`;
      document.body.appendChild(a);a.click();a.remove();
      setTimeout(()=>URL.revokeObjectURL(url),1000);
    }catch(e){console.error('export failed',e);}
  }

  function doImport(){
    const input=document.createElement('input');input.type='file';input.accept='.json,application/json';
    input.onchange=async e=>{
      const file=e.target.files?.[0];if(!file)return;
      try{
        const text=await file.text();
        const obj=JSON.parse(text);
        const data=obj.data||obj;
        let count=0;
        for(const[k,v]of Object.entries(data)){
          if(!k.startsWith('zp_'))continue;
          localStorage.setItem(k,typeof v==='string'?v:JSON.stringify(v));
          count++;
        }
        setImportErr(`✓ ${count} claves importadas. Recarga para aplicar.`);
        setTimeout(()=>window.location.reload(),1500);
      }catch(err){setImportErr('Error al leer el archivo JSON.');}
    };
    input.click();
  }

  function doClearData(){
    if(!window.confirm('¿Borrar todos los datos locales? Esta acción no se puede deshacer.'))return;
    const keys=[];
    for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith('zp_'))keys.push(k);}
    keys.forEach(k=>{if(k!=='zp_auth'&&k!=='zp_auth_remember')localStorage.removeItem(k);});
    window.location.reload();
  }

  async function doResetPassword(){
    if(!user?.email)return;
    setPwMsg('Enviando…');
    try{
      const{error}=await sb.auth.resetPasswordForEmail(user.email);
      setPwMsg(error?'Error al enviar':'Email enviado · revisa tu bandeja');

            <div style={{flex:1,minWidth:0}}>
              {editName
                ?<div style={{display:'flex',gap:8,alignItems:'center'}}>
                  <input autoFocus value={nameVal} onChange={e=>setNameVal(e.target.value)}
                    onKeyDown={e=>{if(e.key==='Enter')saveDisplayName();if(e.key==='Escape')setEditName(false);}}
                    style={{flex:1,fontSize:15,fontWeight:600,color:'var(--text-1)',background:'var(--fill-1)',
                      border:'none',outline:'none',borderRadius:8,padding:'4px 8px',fontFamily:'inherit'}}/>
                  <button onClick={saveDisplayName} disabled={savingName} style={{padding:'5px 12px',borderRadius:8,

// ── AUTH SCREEN ───────────────────────────────────────────────────────────────
const REMEMBER_KEY='zp_auth_remember';
      function loadRemembered(){
        try{const s=localStorage.getItem(REMEMBER_KEY);if(!s)return null;const o=JSON.parse(s);
          if(o&&o.enabled&&Object.prototype.hasOwnProperty.call(o,'password')){
            const cleaned={enabled:true,email:o.email||''};
            localStorage.setItem(REMEMBER_KEY,JSON.stringify(cleaned));
            return cleaned;
          }
          return o&&o.enabled?o:null;}catch{return null;}
      }
function saveRemembered(email,password){
  try{localStorage.setItem(REMEMBER_KEY,JSON.stringify({enabled:true,email}));}catch{}
}
function clearRemembered(){try{localStorage.removeItem(REMEMBER_KEY);}catch{}}

function AuthScreen({dark}){
  const remembered=loadRemembered();
  const[mode,setMode]=useState('login');
  const[email,setEmail]=useState(remembered?.email||'');
  const[password,setPassword]=useState(remembered?.password||'');
  const[confirm,setConfirm]=useState('');
  const[showPwd,setShowPwd]=useState(false);
  const[remember,setRemember]=useState(remembered?true:true);
  const[loading,setLoading]=useState(false);
  const[error,setError]=useState(null);
  const[info,setInfo]=useState(null);

  function reset(){setError(null);setInfo(null);}
  function switchMode(next){setMode(next);reset();setConfirm('');}

  async function submit(e){
    e?.preventDefault?.();
    reset();
    const em=email.trim();
    if(!em||!password){setError('Introduce correo y contraseña.');return;}
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)){setError('Correo electrónico no válido.');return;}
    if(mode==='signup'){
      if(password.length<6){setError('La contraseña debe tener al menos 6 caracteres.');return;}
      if(password!==confirm){setError('Las contraseñas no coinciden.');return;}
    }
    setLoading(true);
    try{
      if(mode==='login'){
        const{error}=await sb.auth.signInWithPassword({email:em,password});
        if(error)throw error;
        if(remember)saveRemembered(em,password);else clearRemembered();
      }else{
        const{data,error}=await sb.auth.signUp({email:em,password});
        if(error)throw error;
        if(data.session){
          if(remember)saveRemembered(em,password);else clearRemembered();
        }else{
          setInfo('Cuenta creada. Revisa tu correo para confirmar e inicia sesión.');
          setMode('login');setPassword('');setConfirm('');
        }
      }
    }catch(err){setError(translateAuthError(err));}
    finally{setLoading(false);}
  }

  const inputStyle={width:'100%',padding:'13px 14px',fontSize:15,color:'var(--text-1)',
    background:'var(--fill-1)',border:'0.5px solid var(--hairline)',borderRadius:12,
    letterSpacing:-0.1,outline:'none',transition:'border-color 0.15s'};

  return<div style={{flex:1,minHeight:0,height:'100%',display:'flex',flexDirection:'column',
    alignItems:'center',justifyContent:'center',padding:'24px 18px',position:'relative',overflow:'hidden'}}>
    {/* Ambient gradient backdrop */}
    <div style={{position:'absolute',inset:0,pointerEvents:'none',
      background:`radial-gradient(60% 50% at 30% 20%,${dark?'rgba(94,92,230,0.22)':'rgba(94,92,230,0.18)'},transparent 70%),
                  radial-gradient(50% 40% at 80% 90%,${dark?'rgba(59,130,246,0.20)':'rgba(59,130,246,0.16)'},transparent 70%)`}}/>
    <div style={{width:'100%',maxWidth:380,position:'relative',zIndex:1,
      display:'flex',flexDirection:'column',alignItems:'center',gap:18}}>
      <div style={{display:'flex',flexDirection:'column',alignItems:'center',gap:10,marginBottom:4}}>
        <ZuppejIcon size={56}/>
        <div style={{fontFamily:'ui-rounded,-apple-system,system-ui',fontSize:24,fontWeight:700,
          letterSpacing:-0.4,color:'var(--text-1)'}}>Zuppi's Agenda</div>
        <div style={{fontSize:13,color:'var(--text-3)',textAlign:'center',letterSpacing:-0.1}}>
          {mode==='login'?'Inicia sesión para continuar':'Crea tu cuenta para empezar'}
        </div>
      </div>

      <GlassSurface radius={22} lift={3} tint={dark?'dark':'neutral'}
        style={{width:'100%',padding:'18px 18px 16px'}}>
        <form onSubmit={submit} style={{display:'flex',flexDirection:'column',gap:10}}>
          <div>
            <label style={{fontSize:11,fontWeight:600,color:'var(--text-3)',
              letterSpacing:0.6,textTransform:'uppercase',display:'block',marginBottom:6,paddingLeft:4}}>Correo</label>
            <input type="email" autoComplete="email" inputMode="email"
              value={email} onChange={e=>setEmail(e.target.value)}
              placeholder="tu@correo.com" style={inputStyle}/>
          </div>
          <div>
            <label style={{fontSize:11,fontWeight:600,color:'var(--text-3)',
              letterSpacing:0.6,textTransform:'uppercase',display:'block',marginBottom:6,paddingLeft:4}}>Contraseña</label>
            <div style={{position:'relative'}}>
              <input type={showPwd?'text':'password'}
                autoComplete={mode==='login'?'current-password':'new-password'}
                value={password} onChange={e=>setPassword(e.target.value)}
                placeholder="••••••••" style={{...inputStyle,paddingRight:64}}/>
              <button type="button" onClick={()=>setShowPwd(v=>!v)}
                style={{position:'absolute',right:8,top:'50%',transform:'translateY(-50%)',
                  padding:'6px 10px',borderRadius:8,fontSize:11,fontWeight:600,
                  color:'var(--text-3)',background:'transparent',letterSpacing:0.2}}>
                {showPwd?'Ocultar':'Ver'}
              </button>
            </div>
          </div>
          {mode==='signup'&&<div>
            <label style={{fontSize:11,fontWeight:600,color:'var(--text-3)',
              letterSpacing:0.6,textTransform:'uppercase',display:'block',marginBottom:6,paddingLeft:4}}>Confirmar contraseña</label>
            <input type={showPwd?'text':'password'} autoComplete="new-password"
              value={confirm} onChange={e=>setConfirm(e.target.value)}
              placeholder="••••••••" style={inputStyle}/>
          </div>}

          <label style={{display:'flex',alignItems:'center',gap:8,padding:'2px 4px',cursor:'pointer',userSelect:'none'}}>
            <span onClick={e=>{e.preventDefault();const next=!remember;setRemember(next);if(!next)clearRemembered();}}
              style={{width:18,height:18,borderRadius:6,flexShrink:0,
                background:remember?'var(--accent)':'transparent',
                border:`1.5px solid ${remember?'var(--accent)':'var(--separator-strong)'}`,
                display:'inline-flex',alignItems:'center',justifyContent:'center',
                color:'var(--accent-ink)',transition:'background 0.15s,border-color 0.15s'}}>
              {remember&&<ICheck size={12} sw={2.6}/>}
            </span>
            <input type="checkbox" checked={remember} onChange={e=>{const v=e.target.checked;setRemember(v);if(!v)clearRemembered();}}
              style={{position:'absolute',opacity:0,width:0,height:0,pointerEvents:'none'}}/>
            <span style={{fontSize:13,color:'var(--text-2)',letterSpacing:-0.1}}>Recordar en este dispositivo</span>
          </label>

          {error&&<div style={{padding:'10px 12px',borderRadius:10,fontSize:13,lineHeight:1.4,
            background:'var(--sys-red-soft)',color:'var(--sys-red)',
            border:'0.5px solid rgba(255,59,48,0.3)'}}>{error}</div>}
          {info&&<div style={{padding:'10px 12px',borderRadius:10,fontSize:13,lineHeight:1.4,

        Zuppi's Agenda · sesión segura con Supabase

  const[isDesktop,setIsDesktop]=useState(()=>window.innerWidth>=768);
  const[session,setSession]=useState(null);
  const[authReady,setAuthReady]=useState(false);
  const[signingOut,setSigningOut]=useState(false);
  const[syncedFor,setSyncedFor]=useState(null);
  const dark=theme==='dark'||theme==='soyon';

  useEffect(()=>{
    const fn=()=>{
      try{const t=JSON.parse(localStorage.getItem('zp_theme')||'"light"');setTheme(t);}catch{}
      try{const a=JSON.parse(localStorage.getItem('zp_accent')||'"blue"');setAccent(a);}catch{}
    };
    window.addEventListener('zp-resync',fn);
    return()=>window.removeEventListener('zp-resync',fn);
  },[setTheme,setAccent]);

  useEffect(()=>{
    let mounted=true;
    sb.auth.getSession().then(({data})=>{
      if(!mounted)return;
      setSession(data.session||null);
      setAuthReady(true);
    }).catch(()=>{if(mounted)setAuthReady(true);});
    const{data:sub}=sb.auth.onAuthStateChange((_e,s)=>{
      if(!mounted)return;
      setSession(s||null);
      setAuthReady(true);
    });
    return()=>{mounted=false;sub.subscription.unsubscribe();};
  },[]);

  // Pull all remote rows on login, then re-hydrate theme/accent from updated localStorage.
  useEffect(()=>{
    if(!authReady)return;
    const uid=session?.user?.id||null;
    if(!uid){setSyncedFor(null);stopRealtime();return;}
    if(syncedFor===uid)return;
    let cancelled=false;
    (async()=>{
      await pullAllRemote(uid);
      seedTaskCompletionsFromStoredTasks();
      ensureRollover(); // Re-run after pull to fix any overwrite from remote data
      if(cancelled)return;
      try{const t=JSON.parse(localStorage.getItem('zp_theme')||'"light"');setTheme(t);}catch{}
      try{const a=JSON.parse(localStorage.getItem('zp_accent')||'"blue"');setAccent(a);}catch{}
      setSyncedFor(uid);
      startRealtime(uid);
    })();
    return()=>{cancelled=true;};
  },[authReady,session?.user?.id,syncedFor,setTheme,setAccent]);

    if((!hasToday||!Array.isArray(habits)||habits.length===0)&&template.length){
      setHabitTemplate(template);
      setHabits(habitsFromTemplate(template));
      return;
    }
    if(hasToday&&template.length&&Array.isArray(habits)&&habits.length>0){
      const current=cleanHabitList(habits,{keepDone:true,dateKey:TODAY_KEY});
      const currentIds=new Set(current.map(h=>h.id));
      const missing=template.filter(h=>!currentIds.has(h.id));
      if(missing.length)setHabits([...current,...missing.map(h=>({...h,done:false}))]);
    }
  },[habitTemplateStructureKey,habitStructureKey,setHabits,setHabitTemplate]);
  useEffect(()=>{
    if(Array.isArray(mental)&&mental.length>0)return;
    const template=latestMentalTemplate();
    if(template.length)setMental(template);
  },[mental,setMental]);
  useEffect(()=>{
    const hasToday=localStorage.getItem('zp_rutina_'+TODAY_KEY)!==null;
    if(hasToday)return;
    const template=latestRutinaTemplate();
    if(template.length)setRutina(template);
  },[setRutina]);

  useEffect(()=>{
    const normalized=normalizeTaskBuckets(tasks);
    const restored=restoreArchivedTasksForDate(TODAY_KEY,normalized.tasks);
    if(restored){setTasks(restored);return;}
    rememberTaskArchive(TODAY_KEY,normalized.tasks);
    if(normalized.changed)setTasks(normalized.tasks);
  },[tasks,setTasks]);
  useEffect(()=>{
    fireCalendarReminders(calEvents);
    const tick=setInterval(()=>fireCalendarReminders(calEvents),10000);
    const onFocus=()=>fireCalendarReminders(calEvents);
    const onVisible=()=>{if(document.visibilityState==='visible')fireCalendarReminders(calEvents);};
    window.addEventListener('focus',onFocus);
    document.addEventListener('visibilitychange',onVisible);
    return()=>{
      clearInterval(tick);
      window.removeEventListener('focus',onFocus);
      document.removeEventListener('visibilitychange',onVisible);
    };
  },[calEvents]);

  const resolvedTab=TAB_ALIAS[tab]||tab;
  const currentTab=TABS.some(t=>t.id===resolvedTab)?resolvedTab:'ideas';
  const Screen=showSettings
    ?<AjustesScreen theme={theme} setTheme={setTheme} accent={accent} setAccent={setAccent}
        user={user} onSignOut={onSignOut} signingOut={signingOut}
        onBack={isDesktop?undefined:()=>setShowSettings(false)}/>
    :currentTab==='hoy'?<HoyScreen {...screenProps} onSettings={()=>setShowSettings(true)}/>
    :currentTab==='semanal'?<SemanalScreen/>
    :currentTab==='agenda'?<AgendaScreen dayTypes={dayTypes} setDayTypes={setDayTypes} calEvents={calEvents} setCalEvents={setCalEvents}/>
    :currentTab==='notas'?<BlocNotasScreen notebook={notebook} setNotebook={setNotebook} agendaNotes={agendaNotes}/>
    :currentTab==='ideas'?<IdeasScreen ideas={ideas} setIdeas={setIdeas} library={library} setLibrary={setLibrary}/>
    :currentTab==='doce'?<DoceScreen/>
    :currentTab==='boveda'?<BovedaScreen passwords={passwords} setPasswords={setPasswords} expenseCats={expenseCats} setExpenseCats={setExpenseCats} expensesRecurring={expensesRecurring} setExpensesRecurring={setExpensesRecurring}/>
    :null;

  return(
    <DCtx.Provider value={isDesktop}>
      <div style={{height:'100%',width:'100%',display:'flex',flexDirection:'row',background:'var(--app-bg)',
        paddingTop:'env(safe-area-inset-top,0px)',overflow:'hidden'}}>
        {isDesktop&&<Sidebar current={showSettings?'__settings':currentTab} onChange={t=>{setTab(t);setShowSettings(false);}}
          streak={streak} onSettings={()=>setShowSettings(!showSettings)} dark={dark} user={user}/>}
        <div className="zp-main" style={{flex:1,display:'flex',flexDirection:'column',overflow:'hidden',minWidth:0}}>
          {isDesktop
            ?<div style={{flex:1,display:'flex',flexDirection:'column',minHeight:0,overflow:'hidden',alignItems:'stretch'}}>
               <div className="zp-screen-wrap" style={{width:'100%',maxWidth:'var(--content-max)',margin:'0 auto',flex:'1 1 auto',minWidth:0}}>{Screen}</div>
             </div>
            :Screen}
          {!isDesktop&&!showSettings&&<TabBar current={currentTab} onChange={setTab} dark={dark}/>}
        </div>
      </div>
    </DCtx.Provider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
